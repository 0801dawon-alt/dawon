v style=\"font-family:'Noto Serif KR',serif;font-size:clamp(32px,4vw,52px);color:#c9c6bf;font-weight:300\">06<\u002Fdiv>\n    <div style=\"width:1px;height:64px;background:#151515\"><\u002Fdiv><div style=\"width:9px;height:9px;border-radius:50%;border:1px solid #151515\"><\u002Fdiv>\n    <div style=\"writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:0.3em\">MY PAGE<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:30px;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h2 style=\"margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(26px,3vw,36px);letter-spacing:-0.02em\">내 기록<\u002Fh2>\n        <div style=\"width:40px;height:2px;background:{{ lAccent }}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ runAnalysis }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:13px;padding:8px 14px;cursor:pointer;border:none;background:#151515;color:#f3f1e8;padding:12px 20px\">{{ anBtnLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#d8d5c6;border:1px solid #d8d5c6\">\n      <sc-for list=\"{{ myStats }}\" as=\"st\" hint-placeholder-count=\"4\"><div style=\"background:#f9f8f2;padding:20px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">{{ st.k }}<\u002Fspan><span style=\"font-family:Pretendard,sans-serif;font-weight:200;font-size:36px;letter-spacing:-0.03em\">{{ st.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">반복되는 실수<\u002Fdiv>\n        <sc-if value=\"{{ noRepeat }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13.5px;color:#6b6966\">답변이 3개 이상 쌓이면 자주 지적된 항목이 표시됩니다.<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ repeatWeak }}\" as=\"x\" hint-placeholder-count=\"0\"><div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e2dfd9;font-size:14px\"><span>{{ x.k }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#7a3530\">{{ x.n }}회<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">꾸준히 잘하는 점<\u002Fdiv>\n        <sc-if value=\"{{ noRepeat }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13.5px;color:#6b6966\">—<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ repeatStrong }}\" as=\"x\" hint-placeholder-count=\"0\"><div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e2dfd9;font-size:14px\"><span>{{ x.k }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:{{ lAccent }}\">{{ x.n }}회<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasAnalysis }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#2a2827;color:#f3f1e8;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap\"><span style=\"font-size:11px;letter-spacing:0.2em;color:#b5b2ac\">누적 분석 · 최근 {{ an.n }}개 답변<\u002Fspan><span style=\"font-size:11px;color:#b5b2ac\">{{ an.date }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Noto Serif KR',serif;font-size:18px;line-height:1.7\">{{ an.summary }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:11px;letter-spacing:0.2em;color:#b5b2ac\">반복 패턴<\u002Fdiv><sc-for list=\"{{ anPatterns }}\" as=\"x\"><div style=\"font-size:14px;line-height:1.7\">− {{ x }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:11px;letter-spacing:0.2em;color:#b5b2ac\">강점<\u002Fdiv><sc-for list=\"{{ anStrengths }}\" as=\"x\"><div style=\"font-size:14px;line-height:1.7\">+ {{ x }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:11px;letter-spacing:0.2em;color:#b5b2ac\">다음 연습 과제<\u002Fdiv><sc-for list=\"{{ anNext }}\" as=\"x\"><div style=\"font-size:14px;line-height:1.7\">→ {{ x }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966;margin-bottom:6px\">답변 기록<\u002Fdiv>\n      <sc-if value=\"{{ noAttempts }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13.5px;color:#6b6966;padding:16px 0\">아직 기록이 없습니다. 타이머에서 답변을 시작해보세요.<\u002Fdiv><\u002Fsc-if>\n      <sc-for list=\"{{ attemptList }}\" as=\"at\" hint-placeholder-count=\"0\">\n        <div style=\"border-bottom:1px solid #e2dfd9\">\n          <div sc-camel-on-click=\"{{ at.toggle }}\" style=\"display:grid;grid-template-columns:90px minmax(0,1fr) 56px;gap:14px;padding:16px 0;cursor:pointer;align-items:baseline\" style-hover=\"opacity:0.7\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#6b6966\">{{ at.date }}<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.6;word-break:keep-all\">{{ at.q }}<\u002Fspan>\n            <span style=\"font-family:Pretendard,sans-serif;font-weight:300;font-size:20px;text-align:right\">{{ at.score }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ at.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:0 0 20px\">\n              <div style=\"font-size:14px;line-height:1.85;background:#efede6;padding:16px;white-space:pre-wrap\">{{ at.text }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.7;color:#2e2d2b\">{{ at.summary }}<\u002Fdiv>\n              <div style=\"display:flex;gap:16px;font-size:12.5px\"><span sc-camel-on-click=\"{{ at.retry }}\" style=\"cursor:pointer;text-decoration:underline\">같은 질문 다시 연습<\u002Fspan><span sc-camel-on-click=\"{{ at.del }}\" style=\"cursor:pointer;text-decoration:underline;color:#7a3530\">삭제<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px clamp(20px,5vw,64px);border-top:1px solid #d8d5c6;font-size:12px;color:#6b6966\">\n  <span>© Thought Library<\u002Fspan><span>항목은 이 브라우저에 저장됩니다<\u002Fspan>\n<\u002Ffooter>\n\n<sc-if value=\"{{ detailOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end\">\n    <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;inset:0;background:rgba(20,20,20,0.45)\"><\u002Fdiv>\n    <aside style=\"position:relative;width:min(680px,100%);height:100%;overflow-y:auto;background:#f9f8f2;display:flex;flex-direction:column\">\n      <div style=\"position:sticky;top:0;background:#f9f8f2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px clamp(20px,4vw,48px);border-bottom:1px solid #d8d5c6;z-index:1\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.15em;color:#6b6966;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;background:{{ odCc }}\"><\u002Fspan>{{ od.category }}<\u002Fspan>\n        <div style=\"display:flex;gap:16px;font-size:13px;align-items:center\">\n          <span sc-camel-on-click=\"{{ restructure }}\" style=\"cursor:pointer;text-decoration:underline\">{{ restructLabel }}<\u002Fspan>\n          <span sc-camel-on-click=\"{{ editOpen }}\" style=\"cursor:pointer;text-decoration:underline\">편집<\u002Fspan>\n          <span sc-camel-on-click=\"{{ deleteOpen }}\" style=\"cursor:pointer;text-decoration:underline\">삭제<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeDetail }}\" style=\"cursor:pointer;font-size:22px;line-height:1\">×<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:clamp(28px,5vw,56px) clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <h2 data-reveal=\"1\" style=\"margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.3;letter-spacing:-0.03em;text-wrap:pretty\">{{ od.title }}<\u002Fh2>\n          <div style=\"width:40px;height:2px;background:{{ accent2 }}\"><\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;line-height:1.8;color:#2e2d2b;text-wrap:pretty\">{{ od.summary }}<\u002Fp>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ odKeywords }}\" as=\"k\" hint-placeholder-count=\"0\">\n              <span style=\"font-size:12px;padding:5px 12px;border:1px solid #c9c6bf;border-radius:999px\">{{ k }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ odHasBackground }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">배경<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.85;text-wrap:pretty\">{{ od.background }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ odHasIssues }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966;margin-bottom:6px\">핵심 쟁점<\u002Fdiv>\n            <sc-for list=\"{{ odIssues }}\" as=\"it\" hint-placeholder-count=\"0\">\n              <div style=\"display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid #e2dfd9\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6966;padding-top:3px\">{{ it.no }}<\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.7\">{{ it.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ odHasPersp }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1px;background:#151515;border:1px solid #151515\">\n            <div style=\"background:#f9f8f2;padding:22px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px\">찬성 · 긍정<\u002Fdiv>\n              <sc-for list=\"{{ odPro }}\" as=\"x\" hint-placeholder-count=\"0\"><div style=\"font-size:14px;line-height:1.7\">— {{ x }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#373533;color:#f3f1e8;padding:22px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px\">반대 · 우려<\u002Fdiv>\n              <sc-for list=\"{{ odCon }}\" as=\"x\" hint-placeholder-count=\"0\"><div style=\"font-size:14px;line-height:1.7\">— {{ x }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ odHasQs }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966;margin-bottom:6px\">예상 질문<\u002Fdiv>\n            <sc-for list=\"{{ odQs }}\" as=\"x\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:start;padding:12px 0;border-bottom:1px solid #e2dfd9\">\n                <span style=\"font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.7\">{{ x.q }}<\u002Fspan>\n                <span sc-camel-on-click=\"{{ x.practice }}\" style=\"font-size:12px;cursor:pointer;text-decoration:underline;white-space:nowrap;padding-top:4px\">연습 →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ odHasTags }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n              <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">관련 뉴스 · 칼럼 · 판례<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8a8780\">실시간 검색 연결 · 관련도순<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ odTagLinks }}\" as=\"tg\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px 0;border-top:1px solid #e2dfd9\">\n                <div style=\"font-family:'Noto Serif KR',serif;font-weight:500;font-size:17px\">#{{ tg.tag }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start\">\n                  <span style=\"font-size:11px;letter-spacing:0.1em;color:#6b6966;padding-top:5px\">뉴스<\u002Fspan>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ tg.news }}\" as=\"n\"><a href=\"{{ n.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px;padding:5px 11px;border:1px solid #c9c6bf;border-radius:999px;text-decoration:none;color:#151515;white-space:nowrap\" style-hover=\"background:#151515;color:#f9f8f2\">{{ n.label }}<\u002Fa><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <span style=\"font-size:11px;letter-spacing:0.1em;color:#6b6966;padding-top:5px\">칼럼·사설<\u002Fspan>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ tg.cols }}\" as=\"n\"><a href=\"{{ n.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px;padding:5px 11px;border:1px solid #c9c6bf;border-radius:999px;text-decoration:none;color:#151515;white-space:nowrap\" style-hover=\"background:#151515;color:#f9f8f2\">{{ n.label }}<\u002Fa><\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#efede6;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"font-size:11px;letter-spacing:0.16em;color:#4a4845\">관련 판례 · #{{ tg.tag }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ tg.cases }}\" as=\"n\"><a href=\"{{ n.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px;padding:6px 12px;background:#f9f8f2;border:1px solid #d8d5c6;text-decoration:none;color:#151515;white-space:nowrap\" style-hover=\"border-color:#151515\">{{ n.label }} ↗<\u002Fa><\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">나의 생각<\u002Fdiv>\n          <textarea value=\"{{ od.myView }}\" sc-camel-on-change=\"{{ onMyView }}\" rows=\"5\" placeholder=\"이 주제에 대한 나의 입장, 근거, 경험을 적어두세요.\" style=\"font:inherit;font-size:15px;line-height:1.8;padding:16px;background:#fff;border:1px solid #d8d5c6;outline:none;resize:vertical;color:#151515\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <sc-if value=\"{{ odHasBody }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">원문 {{ odSource }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.85;color:#2e2d2b;white-space:pre-wrap;background:#efede9;padding:20px;max-height:420px;overflow-y:auto\">{{ od.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ toQFromDetail }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:14px;padding:14px 20px;background:#151515;color:#f3f1e8;border:none;cursor:pointer\">이 주제로 질문 만들기<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toPFromDetail }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:14px;padding:14px 20px;background:transparent;border:1px solid #151515;cursor:pointer\">제시문 만들기<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px\">\n    <div sc-camel-on-click=\"{{ closeForm }}\" style=\"position:absolute;inset:0;background:rgba(20,20,20,0.5)\"><\u002Fdiv>\n    <div style=\"position:relative;width:min(640px,100%);max-height:92vh;overflow-y:auto;background:#f9f8f2;padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <h3 style=\"margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:24px\">{{ formTitle }}<\u002Fh3>\n        <span sc-camel-on-click=\"{{ closeForm }}\" style=\"cursor:pointer;font-size:24px;line-height:1\">×<\u002Fspan>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ pickFile }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" style=\"border:1px dashed #151515;background:{{ dropBg }};padding:28px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;cursor:pointer\">\n        <div style=\"font-family:'Noto Serif KR',serif;font-size:17px\">{{ dropLabel }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b6966;line-height:1.6\">.txt · .md · .json — ‘# 제목’으로 나뉜 문서는 여러 항목으로 분리되고, AI가 요약·쟁점·관점으로 재구성합니다.<\u002Fdiv>\n        <input ref=\"{{ fileRef }}\" type=\"file\" multiple=\"\" accept=\".txt,.md,.markdown,.json,text/plain\" sc-camel-on-change=\"{{ onFileInput }}\" style=\"display:none\">\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:0.2em;color:#6b6966\"><span style=\"flex:1;height:1px;background:#d8d5c6\"><\u002Fspan>또는 직접 작성<span style=\"flex:1;height:1px;background:#d8d5c6\"><\u002Fspan><\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:0.2em;color:#6b6966\">제목\n        <input value=\"{{ form.title }}\" sc-camel-on-change=\"{{ fTitle }}\" placeholder=\"예: 저출산과 인구절벽\" style=\"font:inherit;font-size:16px;letter-spacing:0;padding:10px 0;background:transparent;border:none;border-bottom:1px solid #151515;outline:none;color:#151515\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:0.2em;color:#6b6966\">분류\n        <input value=\"{{ form.category }}\" sc-camel-on-change=\"{{ fCategory }}\" placeholder=\"사회 / 경제 / 환경 / 기술 …\" style=\"font:inherit;font-size:15px;letter-spacing:0;padding:10px 0;background:transparent;border:none;border-bottom:1px solid #151515;outline:none;color:#151515\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:0.2em;color:#6b6966\">한 줄 요약\n        <input value=\"{{ form.summary }}\" sc-camel-on-change=\"{{ fSummary }}\" style=\"font:inherit;font-size:15px;letter-spacing:0;padding:10px 0;background:transparent;border:none;border-bottom:1px solid #151515;outline:none;color:#151515\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:0.2em;color:#6b6966\">키워드 (쉼표로 구분)\n        <input value=\"{{ form.keywords }}\" sc-camel-on-change=\"{{ fKeywords }}\" style=\"font:inherit;font-size:15px;letter-spacing:0;padding:10px 0;background:transparent;border:none;border-bottom:1px solid #151515;outline:none;color:#151515\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:0.2em;color:#6b6966\">내용\n        <textarea value=\"{{ form.body }}\" sc-camel-on-change=\"{{ fBody }}\" rows=\"6\" placeholder=\"자료, 메모, 기사 내용을 붙여넣으세요.\" style=\"font:inherit;font-size:14.5px;letter-spacing:0;line-height:1.7;padding:12px;background:#fff;border:1px solid #d8d5c6;outline:none;resize:vertical;color:#151515\"><\u002Ftextarea>\n      <\u002Flabel>\n      <div style=\"display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ closeForm }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:14px;padding:12px 20px;background:transparent;border:1px solid #151515;cursor:pointer\">취소<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ saveForm }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:14px;padding:12px 24px;background:#151515;color:#f3f1e8;border:none;cursor:pointer\">저장<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:#151515;color:#f3f1e8;padding:12px 20px;font-size:13px\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n{{ introEl }}\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;intro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;애니메이션&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5d6b3a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#5d6b3a&quot;,&quot;#4e6047&quot;,&quot;#7a2e2e&quot;],&quot;section&quot;:&quot;포인트 컬러&quot;},&quot;accent2&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5d6b3a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#5d6b3a&quot;,&quot;#4e6047&quot;,&quot;#373533&quot;],&quot;section&quot;:&quot;포인트 컬러&quot;},&quot;categoryColors&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;분류 컬러&quot;},&quot;cSociety&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7a2e2e&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7a2e2e&quot;,&quot;#8a3b34&quot;],&quot;section&quot;:&quot;분류 컬러&quot;},&quot;cEnv&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7fa35a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7fa35a&quot;,&quot;#6f9a6a&quot;],&quot;section&quot;:&quot;분류 컬러&quot;},&quot;cTech&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c39a2e&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#c39a2e&quot;,&quot;#b8892b&quot;],&quot;section&quot;:&quot;분류 컬러&quot;},&quot;cEthics&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2f4a6b&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2f4a6b&quot;,&quot;#3f5a78&quot;],&quot;section&quot;:&quot;분류 컬러&quot;}}\">\nconst LS = 'thoughtlib_entries_v1';\nconst SEED = [\n {id:'s1',category:'사회',title:'저출산과 인구절벽',summary:'합계출산율이 0.7명대까지 떨어지며 노동력 감소, 내수 위축, 연금·지역 소멸 문제가 연쇄적으로 심화되고 있다.',keywords:['합계출산율','인구구조','일·가정 양립'],background:'주거비·사교육비 부담, 장시간 노동, 경력 단절 우려, 결혼·출산에 대한 가치관 변화가 복합적으로 작용한다. 현금성 지원 중심의 정책이 효과를 거두지 못했다는 평가가 많다.',issues:['현금 지원 vs 구조 개혁(주거·노동시장) 중 무엇이 우선인가','출산을 ‘국가 과제’로 보는 시각은 개인의 선택권과 충돌하지 않는가','이민 확대가 대안이 될 수 있는가'],pro:['육아휴직·유연근무 확대는 실질적 양육 부담을 줄인다','주거 지원은 결혼 시점을 앞당기는 효과가 있다'],con:['단기 현금 지원은 재정 부담 대비 효과가 낮다','출산율 목표 중심 정책은 삶의 질 문제를 놓친다'],questions:['저출산의 가장 근본적인 원인은 무엇이라고 생각하나요?','출산 장려금 정책의 한계와 대안을 말해보세요.','이민 확대가 저출산의 해법이 될 수 있을까요?'],myView:''},\n {id:'s2',category:'환경',title:'기후위기와 탄소중립',summary:'2050 탄소중립 목표 아래 에너지 전환이 진행 중이지만, 산업 경쟁력·일자리·비용 분담을 둘러싼 갈등이 크다.',keywords:['탄소중립','에너지 전환','정의로운 전환'],background:'한국은 제조업 비중과 화석연료 의존도가 높아 감축 부담이 크다. 탄소국경조정제도 등 국제 규제가 강화되며 산업계 대응도 시급해졌다.',issues:['원전은 탄소중립의 수단인가, 위험 요인인가','전환 과정에서 피해를 보는 노동자·지역은 누가 책임지는가','개인의 실천과 구조적 규제 중 무엇이 더 중요한가'],pro:['재생에너지 투자는 새로운 산업과 일자리를 만든다','국제 규제 대응은 수출 경쟁력과 직결된다'],con:['급격한 전환은 전기요금 상승과 산업 위축을 부른다','석탄 발전 지역의 고용 충격이 크다'],questions:['정의로운 전환이란 무엇이며 왜 필요한가요?','개인의 친환경 실천은 의미가 있다고 보나요?','원전에 대한 본인의 입장을 근거와 함께 말해보세요.'],myView:''},\n {id:'s3',category:'기술',title:'생성형 AI와 일자리',summary:'생성형 AI가 사무·창작 영역까지 대체·보완하면서 노동시장 재편, 저작권, 교육의 방향이 새로운 쟁점이 되었다.',keywords:['생성형 AI','자동화','저작권'],background:'과거 자동화가 단순 반복 노동에 집중됐다면, 생성형 AI는 글쓰기·코딩·디자인 등 지식노동에 영향을 준다. 생산성 향상과 일자리 감소 우려가 공존한다.',issues:['AI가 만든 결과물의 저작권과 책임은 누구에게 있는가','일자리 감소에 대한 사회 안전망(재교육, 기본소득)은 충분한가','교육 현장에서 AI 사용을 허용해야 하는가'],pro:['반복 업무를 줄여 고부가가치 업무에 집중하게 한다','새로운 직무와 산업이 생겨난다'],con:['전환 속도가 빨라 재교육이 따라가지 못한다','학습 데이터의 저작권 침해 문제가 해결되지 않았다'],questions:['AI 시대에 인간에게 필요한 역량은 무엇인가요?','AI 생성물의 저작권을 인정해야 할까요?','학교에서 AI 사용을 어디까지 허용해야 할까요?'],myView:''},\n {id:'s4',category:'사회',title:'지방소멸과 수도권 집
