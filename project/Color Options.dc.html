<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>body{margin:0;background:#dcdad5;font-family:Pretendard,sans-serif}a{color:#151515}a:hover{color:#6b6966}*{box-sizing:border-box}</style>
</helmet>
<section style="padding:48px;display:flex;flex-direction:column;gap:24px">
  <div style="font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700">키컬러 예시</div>
  <div style="display:flex;flex-wrap:wrap;gap:40px">
    <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
      <div id="{{ o.id }}" style="width:620px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;background:#151515;color:#fff;padding:3px 8px">{{ o.id }}</span>
          <span style="font-size:16px;font-weight:600">{{ o.name }}</span>
        </div>
        <div style="background:{{ o.bg }};color:{{ o.ink }};box-shadow:0 20px 40px -20px rgba(0,0,0,0.3)">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 22px">
            <div style="display:flex;align-items:center;gap:8px"><div style="width:18px;height:18px;border:1.5px solid {{ o.ink }}"></div><div style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:11px;line-height:1.05">Thought<br>Library</div></div>
            <div style="display:flex;gap:14px;font-size:8px;letter-spacing:0.18em">LIBRARY QUESTIONS PASSAGE TIMER</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;min-height:230px">
            <div style="padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:14px">
              <div style="font-family:'Noto Serif KR',serif;font-weight:500;font-size:24px;line-height:1.25;letter-spacing:-0.03em">사회문제에 대해,<br>당신의 생각은<br>무엇인가요?</div>
              <div style="display:flex;gap:6px">
                <span style="font-size:10px;padding:8px 12px;background:{{ o.btn }};color:{{ o.btnFg }}">파일 업로드</span>
                <span style="font-size:10px;padding:8px 12px;border:1px solid {{ o.ink }}">직접 추가</span>
              </div>
            </div>
            <div style="background:{{ o.block }};color:{{ o.blockFg }};padding:22px;display:flex;flex-direction:column;justify-content:flex-end">
              <sc-for list="{{ o.idx }}" as="ix"><div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid {{ o.blockLine }};font-family:'Noto Serif KR',serif;font-weight:300;font-size:15px"><span>{{ ix }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;opacity:0.7">02</span></div></sc-for>
            </div>
          </div>
          <div style="padding:20px 22px;display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;gap:6px">
              <span style="font-size:10px;padding:5px 10px;background:{{ o.accent }};color:{{ o.accentFg }};border:1px solid {{ o.accent }}">전체</span>
              <span style="font-size:10px;padding:5px 10px;border:1px solid {{ o.ink }}">사회</span>
              <span style="font-size:10px;padding:5px 10px;border:1px solid {{ o.ink }}">환경</span>
              <span style="font-size:10px;padding:5px 10px;border:1px solid {{ o.ink }}">기술</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:{{ o.line }};border:1px solid {{ o.line }}">
              <sc-for list="{{ o.cards }}" as="c"><div style="background:{{ o.card }};padding:12px;display:flex;flex-direction:column;gap:6px;min-height:92px"><div style="font-family:'IBM Plex Mono',monospace;font-size:8px;color:{{ o.mute }}">{{ c.no }}</div><div style="font-family:'Noto Serif KR',serif;font-size:12px;font-weight:500">{{ c.t }}</div><div style="font-size:8px;color:{{ o.mute }};line-height:1.5">쟁점과 관점을 정리한 지식 카드</div></div></sc-for>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1.2fr 1fr;border-top:1px solid {{ o.line }}">
            <div style="padding:18px 22px;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:0.2em"><span style="width:6px;height:6px;border-radius:50%;background:{{ o.accent }}"></span>답변 시간</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-weight:300;font-size:52px;line-height:0.9;color:{{ o.timer }}">01:24</div>
              <div style="height:2px;background:{{ o.line }}"><div style="width:42%;height:2px;background:{{ o.accent }}"></div></div>
            </div>
            <div style="background:{{ o.block }};color:{{ o.blockFg }};padding:18px;display:flex;flex-direction:column;gap:8px;justify-content:center">
              <div style="font-size:8px;letter-spacing:0.2em;opacity:0.7">준비 시간</div>
              <div style="display:flex;gap:4px"><span style="font-size:9px;padding:4px 8px;border:1px solid {{ o.blockFg }}">1분</span><span style="font-size:9px;padding:4px 8px;background:{{ o.blockFg }};color:{{ o.block }}">3분</span><span style="font-size:9px;padding:4px 8px;border:1px solid {{ o.blockFg }}">5분</span></div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:6px">
          <sc-for list="{{ o.sw }}" as="s"><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><div style="width:56px;height:28px;background:{{ s }};border:1px solid rgba(0,0,0,0.1)"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:10px">{{ s }}</span></div></sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const IDX=['사회','환경','기술','경제'];
const CARDS=[{no:'01',t:'저출산과 인구절벽'},{no:'02',t:'기후위기와 탄소중립'},{no:'03',t:'생성형 AI와 일자리'}];
const O=[
 {id:'2b',name:'포레스트 그린 + 크림 · 밝은 차콜 블록',bg:'#f3f1e8',ink:'#1c241f',block:'#373533',blockFg:'#f3f1e8',blockLine:'#4b4845',btn:'#373533',btnFg:'#f3f1e8',accent:'#5d6b3a',accentFg:'#fff',card:'#f9f8f2',line:'#d8d5c6',mute:'#6a6f62',timer:'#5d6b3a'},
 {id:'3b',name:'버건디 + 아이보리 · 밝은 차콜 블록',bg:'#f6f3ec',ink:'#171515',block:'#373533',blockFg:'#f6f3ec',blockLine:'#4b4845',btn:'#7a2e2e',btnFg:'#fff',accent:'#7a2e2e',accentFg:'#fff',card:'#fbf9f4',line:'#dbd5ca',mute:'#6e6863',timer:'#7a2e2e'},
 {id:'1',name:'딥 네이비 + 웜 페이퍼',bg:'#f4f2ed',ink:'#18212b',block:'#1c2a3a',blockFg:'#eef0f2',blockLine:'#33445a',btn:'#1c2a3a',btnFg:'#f4f2ed',accent:'#2f4a6b',accentFg:'#fff',card:'#faf9f6',line:'#d6d3cb',mute:'#6b6f75',timer:'#1c2a3a'},
 {id:'2',name:'포레스트 그린 + 크림',bg:'#f3f1e8',ink:'#1c241f',block:'#1f2b24',blockFg:'#eef0e8',blockLine:'#3a4a3f',btn:'#1f2b24',btnFg:'#f3f1e8',accent:'#5d6b3a',accentFg:'#fff',card:'#f9f8f2',line:'#d8d5c6',mute:'#6a6f62',timer:'#1f2b24'},
 {id:'3',name:'버건디 + 아이보리',bg:'#f6f3ec',ink:'#171515',block:'#161616',blockFg:'#f6f3ec',blockLine:'#2e2e2e',btn:'#7a2e2e',btnFg:'#fff',accent:'#7a2e2e',accentFg:'#fff',card:'#fbf9f4',line:'#dbd5ca',mute:'#6e6863',timer:'#7a2e2e'},
 {id:'4',name:'차콜 + 테라코타',bg:'#f4f3f0',ink:'#151515',block:'#232323',blockFg:'#f4f3f0',blockLine:'#3a3a3a',btn:'#151515',btnFg:'#f4f3f0',accent:'#b5552f',accentFg:'#fff',card:'#f9f8f6',line:'#d4d1ca',mute:'#6b6966',timer:'#b5552f'}
];
class Component extends DCLogic {
  renderVals(){ return { opts:O.map(o=>({...o,idx:IDX,cards:CARDS,sw:[o.bg,o.block,o.accent,o.ink]})) }; }
}
</script>
</body>
</html>
