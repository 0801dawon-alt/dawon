<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Thought Library</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#f3f1e8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Thought Library" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500&display=swap" />
<style>
  /* Home-screen launcher: opens the Claude-connected library or the chat with Claude, under the same logo. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #f3f1e8; color: #151515; font-family: 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 52px; height: 52px; }
  h1 { margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 26px; line-height: 1.2; letter-spacing: -0.02em; }
  .bar { width: 40px; height: 3px; background: #7F4C4C; }
  a.card { display: flex; flex-direction: column; gap: 6px; padding: 22px 20px; text-decoration: none; color: inherit; border: 1px solid #151515; background: #fff; }
  a.card.dark { background: #151515; color: #f3f1e8; }
  a.card strong { font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 700; }
  a.card span { font-size: 13.5px; line-height: 1.6; opacity: .75; }
  a.card:active { transform: translateY(1px); }
  .small { font-size: 12.5px; color: #6b6964; line-height: 1.7; }
  .small a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="12" fill="#7F4C4C"/><clipPath id="c"><rect width="26" height="26"/></clipPath><circle cx="26" cy="26" r="12" fill="#5d6b3a" clip-path="url(#c)"/><rect x="0.75" y="0.75" width="24.5" height="24.5" fill="none" stroke="#151515" stroke-width="1.5"/></svg>
    <h1>Thought<br />Library</h1>
  </div>
  <div class="bar"></div>
  <a class="card" href="https://claude.ai/artifact/Y9WdgjDnkGwq1eqap33XgE">
    <strong>지식서재 열기 →</strong>
    <span>Claude에 연결된 상태로 열려요. 읽은 주제, 나의 생각, 답변과 피드백이 내 Claude 계정에 저장돼서 휴대폰·노트북 어디서 열어도 똑같이 보여요.</span>
  </a>
  <a class="card dark" href="https://claude.ai/code/session_014Z7J9UNLzGHZxQRwttTMC5">
    <strong>Claude와 채팅 →</strong>
    <span>지식서재를 함께 만들어 온 대화창이에요. 수정 요청이나 질문을 여기서 하세요.</span>
  </a>
  <div class="small">말로 답할 때는 키보드의 마이크(휴대폰)나 받아쓰기(Mac: fn 두 번)를 쓰면 돼요. <a href="../">홈페이지</a>의 기록은 그 브라우저에만 남으니, 예전 기록은 홈페이지 맨 아래 ‘기록 옮기기’에서 복사해 지식서재 답변 칸에 붙여 넣어 옮기세요.</div>
</main>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
</script>
</body>
</html>
