document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

장과 균형발전이 우선이라는 주장 중 어느 쪽입니까?','지방에 몇 개 거점 메가시티만 키우는 전략은 또 다른 불균형을 만들지 않습니까?','혁신도시 공공기관 이전은 실패한 정책이라는 평가에 동의합니까?'],\n'플랫폼 노동':['배달 기사를 근로자로 인정하면 유연성이 사라지고 일자리가 줄어든다는 반론에 어떻게 답하겠습니까?','알고리즘이 배차와 평가를 결정한다면 그것을 사용자의 지휘·감독으로 볼 수 있습니까?','플랫폼 수수료를 법으로 상한 규제하는 것은 시장 개입입니까, 공정 회복입니까?'],\n'표현의 자유와 혐오 표현':['혐오 표현을 법으로 처벌하면 정당한 비판까지 위축된다는 우려와 소수자 보호 중 무엇을 우선하겠습니까?','플랫폼 기업에 혐오 게시물 삭제 의무를 지우는 것은 사적 검열을 강화하는 것 아닙니까?','혐오와 풍자의 경계를 누가 정해야 합니까?'],\n'디지털 격차':['키오스크·앱 전환으로 비용을 줄이는 기업에 오프라인 창구 유지를 강제해야 합니까?','디지털 교육만으로 고령층 격차를 해소할 수 있다는 주장의 한계는 무엇입니까?','효율성을 위해 일부 시민의 불편을 감수해야 한다는 주장에 동의합니까?'],\n'고령화와 연금개혁':['더 내고 더 받는 안과 더 내고 덜 받는 안 중 무엇을 택하겠으며, 청년 세대에 어떻게 설득하겠습니까?','국민연금 국가 지급 보장을 법에 명문화하는 것은 재정 책임을 미래로 미루는 것 아닙니까?','정년 연장은 노인 빈곤 해법입니까, 청년 일자리를 빼앗는 정책입니까?'],\n'촉법소년 연령 하향':['촉법소년 연령을 낮추면 범죄가 줄어든다는 근거가 부족한데도 하향해야 합니까?','피해자의 법 감정과 소년의 교화 가능성이 충돌할 때 무엇을 우선하겠습니까?','처벌 강화 대신 보호처분 시설을 늘리자는 주장은 현실적입니까?'],\n'난민 수용과 다문화 사회':['난민 수용은 국제적 의무라는 주장과 국민의 안전과 합의가 먼저라는 주장 중 어느 쪽입니까?','난민 심사를 엄격하게 하는 것은 가짜 난민을 거르는 것입니까, 진짜 난민을 외면하는 것입니까?','인도주의와 국익이 충돌할 때 정부는 어떤 기준으로 판단해야 합니까?'],\n'사교육과 교육 불평등':['사교육을 법으로 규제하는 것은 교육 격차 해소입니까, 학부모의 선택권 침해입니까?','수능 위주 정시 확대와 학생부 위주 수시 확대 중 어느 쪽이 더 공정합니까?','지역균형 선발은 기회의 평등입니까, 역차별입니까?'],\n'가짜뉴스와 미디어 리터러시':['가짜뉴스를 법으로 처벌하면 정부가 진실을 판정하게 된다는 우려에 어떻게 답하겠습니까?','허위정보 확산의 책임은 작성자, 플랫폼, 소비자 중 누구에게 가장 큽니까?','표현의 자유를 위해 일부 허위정보는 감수해야 한다는 주장에 동의합니까?'],\n'필수의료 공백과 의사 인력':['의대 정원 확대가 필수의료 공백을 해결한다는 주장과 수가·근무 환경 개선이 먼저라는 주장 중 어느 쪽입니까?','의사 집단행동은 직업적 권리입니까, 환자 생명을 담보로 한 압박입니까?','지역 의사제처럼 근무지를 일정 기간 의무화하는 것은 직업 선택의 자유 침해입니까?'],\n'선거제도 개편':['비례대표를 늘리면 대표성은 높아지지만 위성정당 같은 편법이 반복됩니다. 그래도 확대해야 합니까?','소선거구제의 사표 문제와 중대선거구제의 책임성 약화 중 무엇이 더 큰 문제입니까?'],\n'정치 양극화와 팬덤정치':['강성 지지층은 정치 참여의 확대입니까, 타협을 막는 장애물입니까?','정당이 팬덤에 휘둘리지 않도록 제도로 막는 것이 정치적 자유를 해치지 않습니까?'],\n'청년 정치 참여':['청년 공천 할당제는 대표성 확대입니까, 능력과 무관한 특혜입니까?','청년 정치인이 청년의 이익만 대변해야 합니까, 전체를 대변해야 합니까?'],\n'지방자치와 재정분권':['재정분권을 확대하면 부자 지자체와 가난한 지자체의 격차가 커진다는 반론에 어떻게 답하겠습니까?','지방정부의 포퓰리즘 사업을 막기 위해 중앙의 통제가 필요하다는 주장에 동의합니까?'],\n'대통령제와 권력구조 개헌':['4년 중임제는 책임정치를 강화합니까, 권력 집중을 더 키웁니까?','분권형 대통령제가 한국 정치 문화에서 작동할 수 있다고 봅니까?'],\n'국회의원 특권 논란':['불체포특권을 폐지하면 권력의 야당 탄압 수단이 된다는 반론에 어떻게 답하겠습니까?','국회의원 세비를 중위소득 수준으로 낮추자는 주장은 개혁입니까, 포퓰리즘입니까?'],\n'여론조사와 민주주의':['선거 직전 여론조사 공표 금지는 유권자의 알 권리를 침해합니까, 왜곡을 막습니까?','부정확한 여론조사의 책임을 조사 기관에 법적으로 물어야 합니까?'],\n'국민투표와 직접민주주의':['국민발안제는 국민 주권의 확대입니까, 다수의 횡포를 부르는 위험입니까?','국회의원 국민소환제가 책임정치를 강화한다는 주장과 소신 정치를 위축시킨다는 주장 중 어느 쪽에 동의합니까?'],\n'공직자 이해충돌 방지':['공직자의 부동산 보유를 제한하는 것은 투명성 확보입니까, 재산권 침해입니까?','정보를 이용한 투기는 처벌하되 단순 보유까지 규제하는 것은 과도하지 않습니까?'],\n'정당 공천 제도':['국민 경선 확대는 공천의 민주화입니까, 인지도 높은 후보에게만 유리한 제도입니까?','당 지도부의 전략 공천은 필요한 권한입니까, 사천의 통로입니까?'],\n'세대 갈등과 정치':['세대 갈등은 실제 이해 충돌입니까, 정치가 표를 위해 만든 프레임입니까?','연금·부동산 문제에서 기성세대의 양보를 요구하는 것은 정당합니까?'],\n'젠더 갈등과 정치':['청년 젠더 갈등은 실제 차별의 문제입니까, 경쟁 심화가 만든 갈등입니까?','여성가족부 폐지 논란에서 부처의 존재 이유와 효율성 중 무엇을 기준으로 판단하겠습니까?'],\n'남북관계와 통일 정책':['통일 비용이 너무 크니 평화적 두 국가 공존이 현실적이라는 주장에 동의합니까?','대북 정책은 압박이 효과적입니까, 대화가 효과적입니까?'],\n'국방과 병역제도':['병역 자원 감소를 이유로 여성 징병제를 도입해야 한다는 주장에 대해 찬반 입장을 밝히고 근거를 제시해보시오.','모병제 전환은 국방력 강화입니까, 가난한 청년만 군대에 가는 구조를 만듭니까?'],\n'행정수도와 균형발전':['대통령실과 국회를 세종으로 옮기는 것은 균형발전입니까, 행정 비효율만 키우는 일입니까?','수도 이전은 헌법 개정이 필요한 문제라는 주장을 어떻게 봅니까?'],\n'정치 후원금과 정치자금':['기업의 정치 후원을 허용하면 투명해진다는 주장과 정경유착이 부활한다는 주장 중 어느 쪽입니까?','소액 후원 세액공제 확대는 정치 참여 확대입니까, 팬덤 정치 강화입니까?'],\n'공공기관 지방 이전':['2차 공공기관 이전은 지역을 살립니까, 직원 가족은 수도권에 남는 반쪽짜리 정책입니까?','이전 기관 직원의 선택권과 균형발전 목표가 충돌할 때 무엇을 우선해야 합니까?'],\n'정치 유튜브와 여론':['허위 정보를 퍼뜨리는 정치 유튜버를 규제하는 것은 표현의 자유 침해입니까?','정치 유튜브 수익 구조가 극단적 주장을 부추긴다면 플랫폼이 책임져야 합니까?'],\n'시민단체의 역할과 책임':['정부 보조금을 받는 시민단체가 정부를 견제할 수 있습니까?','시민단체 회계 감사 강화는 투명성 확보입니까, 비판 세력 길들이기입니까?'],\n'최저임금 인상':['최저임금 인상은 저임금 노동자를 보호합니까, 오히려 그들의 일자리를 없앱니까?','업종·지역별 최저임금 차등 적용은 현실 반영입니까, 최저선의 의미를 무너뜨리는 것입니까?'],\n'부동산 가격과 주거 불평등':['집값 안정을 위해 공급 확대와 다주택자 규제 중 하나만 택한다면 무엇입니까?','주택을 투자 수단으로 보는 것을 제한해야 한다는 주장은 재산권 침해 아닙니까?'],\n'가계부채':['대출 규제 강화는 금융 안정입니까, 실수요자의 내 집 마련을 막는 것입니까?','빚을 감당하지 못한 개인을 국가가 구제하는 것은 도덕적 해이를 부르지 않습니까?'],\n'기본소득':['보편적 기본소득과 취약계층 선별 복지 중 같은 예산이라면 무엇을 택하겠습니까?','기본소득이 근로 의욕을 떨어뜨린다는 주장을 지지하거나 반박해보시오.'],\n'주 4일제와 노동시간':['주 4일제는 생산성을 높입니까, 중소기업과 비정규직에겐 그림의 떡입니까?','노동시간 단축과 임금 유지가 함께 가능하다고 봅니까?'],\n'정규직·비정규직 격차':['비정규직의 정규직 전환은 공정입니까, 공채로 입사한 사람에 대한 역차별입니까?','정규직 해고를 쉽게 하는 대신 비정규직을 줄이자는 노동 유연화 주장에 동의합니까?'],\n'청년 실업과 니트족':['청년 실업은 일자리 부족 문제입니까, 청년의 눈높이 문제입니까?','구직을 포기한 청년에게 현금 지원을 하는 것은 자립을 돕습니까, 의존을 키웁니까?'],\n'재벌 개혁과 대기업 집중':['재벌 규제를 강화하면 글로벌 경쟁력이 떨어진다는 반론에 어떻게 답하겠습니까?','총수 일가 경영 승계는 기업의 자율입니까, 규제해야 할 문제입니까?'],\n'중소기업과 하도급':['납품단가 연동제는 공정 거래입니까, 시장 가격 결정에 대한 과도한 개입입니까?','하청 노동자가 원청과 직접 교섭할 수 있어야 한다는 주장에 동의합니까?'],\n'자영업 위기':['자영업 과밀을 막기 위해 창업을 제한하는 것은 직업의 자유 침해입니까?','배달 플랫폼 수수료를 정부가 규제해야 합니까, 시장에 맡겨야 합니까?'],\n'저성장과 잠재성장률 하락':['저성장 시대에 성장을 위한 규제 완화와 분배를 위한 복지 확대 중 무엇이 우선입니까?','성장률보다 삶의 질을 정책 목표로 삼아야 한다는 주장에 동의합니까?'],\n'조세 정의와 부자 감세':['상속세 인하는 기업 승계를 돕는 합리적 조치입니까, 부의 대물림을 강화하는 것입니까?','법인세 인하가 투자와 고용을 늘린다는 주장은 실증적으로 타당합니까?'],\n'가상자산과 투자 규제':['가상자산 과세는 조세 형평입니까, 투자자 보호 장치도 없이 세금만 걷는 것입니까?','가상자산을 금융상품으로 인정하고 제도권에 넣어야 합니까?'],\n'금융 문맹과 청년 투자':['청년의 빚투는 개인의 선택이니 국가가 개입할 필요가 없다는 주장에 동의합니까?','학교 투자 교육 의무화가 청년의 무리한 빚투를 줄인다고 생각합니까, 오히려 투기를 부추긴다고 생각합니까?'],\n'물가 상승과 생활비 위기':['물가를 잡기 위한 금리 인상은 서민의 이자 부담을 키웁니다. 그래도 올려야 합니까?','정부가 공공요금 인상을 억제하는 것은 서민 보호입니까, 공기업 부실을 키우는 것입니까?'],\n'중대재해처벌법':['중대재해처벌법은 안전 투자를 늘렸습니까, 중소기업에 과도한 형사 책임을 지웠습니까?','사고 책임을 경영자 처벌로 묻는 것과 현장 안전 시스템 개선 중 무엇이 더 효과적입니까?'],\n'이민과 외국인 노동자':['외국인 노동자 확대는 인력난 해소입니까, 내국인 저임금 노동자의 일자리 위협입니까?','외국인 가사도우미에게 최저임금을 다르게 적용하자는 주장에 대해 어떻게 생각합니까?'],\n'공기업 효율화와 민영화':['철도·전기 민영화는 효율성을 높입니까, 공공성과 요금 안정성을 해칩니까?','적자 공기업의 요금 인상과 세금 지원 중 무엇이 더 공정합니까?'],\n'고령화와 노인 돌봄':['노인 돌봄은 가족의 책임입니까, 국가의 책임입니까?','돌봄 인력 부족을 외국인 노동자로 채우는 것은 해결책입니까, 돌봄 노동 저평가를 고착시키는 것입니까?'],\n'1인 가구 증가':['정책이 4인 가구 중심에서 1인 가구 중심으로 바뀌어야 한다는 주장은 저출산 대책과 충돌하지 않습니까?','1인 가구 증가는 개인의 선택입니까, 사회 구조가 만든 결과입니까?'],\n'고독사와 사회적 고립':['고립된 사람을 국가가 찾아내 개입하는 것은 보호입니까, 사생활 침해입니까?','공동체 해체를 막기 위해 국가가 할 수 있는 일에는 한계가 있지 않습니까?'],\n'학교폭력':['학교폭력 기록을 대입에 반영하는 것은 정당한 책임입니까, 소송만 늘리는 이중 처벌입니까?','가해 학생의 교육받을 권리와 피해 학생의 안전이 충돌할 때 무엇을 우선하겠습니까?'],\n'교권 침해':['교권 보호를 위해 학생인권조례를 축소해야 한다는 주장에 동 사이버 보안':['국가 사이버 안보를 위해 정보기관의 민간 통신 감시 권한을 확대해야 합니까?','랜섬웨어 공격을 받은 기업이 몸값을 지불하는 것을 금지해야 합니까?'],\n'로봇과 일자리 자동화':['로봇세 도입은 일자리 잃은 사람을 위한 재원입니까, 혁신에 대한 벌금입니까?','자동화로 인한 실업은 개인의 재교육 책임입니까, 국가의 책임입니까?'],\n'플랫폼 독점':['거대 플랫폼을 사전 규제하는 플랫폼법은 공정 경쟁입니까, 국내 기업만 묶는 역차별입니까?','무료 서비스를 제공하는 플랫폼의 독점이 소비자에게 해가 됩니까?'],\n'기초과학 투자와 R&D':['성과가 불확실한 기초과학에 세금을 투입하는 것이 정당합니까?','R&D 예산 효율화를 위한 삭감은 낭비 제거입니까, 미래 경쟁력 포기입니까?'],\n'이공계 인재 유출':['해외로 나간 이공계 인재를 돌아오게 하려면 연봉입니까, 연구 환경입니까?','이공계 병역특례를 확대해야 합니까?'],\n'메타버스와 가상세계':['가상공간에서 아바타에 대한 성희롱을 현실 범죄처럼 처벌해야 합니까?','메타버스는 실체 있는 미래입니까, 지나간 유행입니까?'],\n'디지털 중독':['청소년의 스마트폰 사용을 학교에서 전면 금지해야 합니까?','디지털 중독의 책임은 중독을 유도하는 설계를 한 기업에 있습니까?'],\n'의약품 접근성과 신약 가격':['수억 원대 신약에 건강보험을 적용하면 다른 환자의 보장이 줄어듭니다. 그래도 적용해야 합니까?','제약사의 특허권과 환자의 생명권이 충돌할 때 무엇을 우선해야 합니까?'],\n'원자력 발전':['원전 확대는 탄소중립과 에너지 안보를 위한 현실적 선택입니까, 위험의 미래 전가입니까?','원전 사고 확률이 낮다면 그 위험을 감수할 가치가 있습니까?'],\n'재생에너지 전환':['재생에너지 확대로 전기요금이 오른다면 국민이 감수해야 합니까?','태양광 시설이 산림을 훼손한다면 그것은 친환경입니까?'],\n'플라스틱 쓰레기':['일회용컵 보증금제는 효과적인 정책입니까, 소상공인에게 부담만 지우는 정책입니까?','플라스틱 문제의 책임은 생산 기업과 소비자 중 누구에게 더 있습니까?'],\n'미세먼지':['국내 미세먼지 대책보다 중국과의 외교 협상이 우선이라는 주장에 동의합니까?','미세먼지 저감을 위해 노후 경유차 운행을 금지하는 것은 서민에게 부담을 지우는 것 아닙니까?'],\n'후쿠시마 오염수 방류':['국제기구가 안전하다고 해도 국민이 불안하다면 정부는 무엇을 기준으로 대응해야 합니까?','과학적 판단과 국민 감정이 충돌할 때 정책은 어느 쪽을 따라야 합니까?'],\n'탄소세와 배출권 거래제':['탄소세는 효과적인 감축 수단입니까, 서민과 제조업에 부담을 전가하는 세금입니까?','탄소세 수입을 국민에게 배당으로 돌려주자는 주장에 동의합니까?'],\n'기후 소송과 미래세대':['기후 위기 대응을 법원이 정부에 명령하는 것은 사법의 월권입니까?','현재 세대의 경제적 이익과 미래 세대의 환경권 중 무엇을 우선해야 합니까?'],\n'이상기후와 재난 대응':['재난 위험 지역 거주를 제한하는 것은 생명 보호입니까, 거주 이전의 자유 침해입니까?','기후 재난 피해를 국가가 어디까지 보상해야 합니까?'],\n'물 부족과 수자원':['물값을 올려 사용량을 줄이는 것은 효율적입니까, 기본권을 시장에 맡기는 것입니까?','댐 건설은 물 부족 해법입니까, 환경 파괴입니까?'],\n'생물다양성 감소':['멸종위기종 보호를 위해 개발 사업을 중단해야 한다면 그 경제적 손실은 누가 부담해야 합니까?','인간에게 쓸모없는 생물도 보호해야 하는 이유는 무엇입니까?'],\n'전기차 전환':['배터리 생산과 전력 생산 과정까지 보면 전기차는 정말 친환경입니까?','내연기관차 판매 금지 시점을 법으로 정해야 합니까?'],\n'그린워싱':['그린워싱 기업을 처벌하면 친환경 시도 자체가 위축된다는 반론에 어떻게 답하겠습니까?','소비자가 친환경 마케팅을 판별할 책임도 있다고 봅니까?'],\n'음식물 쓰레기와 식량 낭비':['유통기한이 지난 음식의 기부를 활성화하기 위해 기업의 책임을 면제해야 합니까?','음식물 쓰레기 종량제 요금을 크게 올려야 합니까?'],\n'기후 난민':['기후 난민을 국제법상 난민으로 인정해야 합니까?','탄소를 많이 배출한 선진국이 기후 난민을 더 많이 받아야 한다는 주장에 동의합니까?'],\n'개발과 환경 보존':['지역 주민이 원하는 개발 사업을 환경 보호를 이유로 막을 수 있습니까?','환경영향평가가 형식적이라는 비판에 어떤 개선책을 제시하겠습니까?'],\n'비건과 육식 문화':['육식 감축을 위해 육류에 세금을 부과하는 것은 정당합니까?','학교 급식에 채식 선택권을 의무화해야 합니까?'],\n'에너지 요금 현실화':['전기요금을 원가 수준으로 올리는 것은 시장 정상화입니까, 서민 부담 가중입니까?','한전 적자를 요금 인상과 세금 투입 중 무엇으로 메워야 합니까?'],\n'핵폐기물 처분장':['방폐장 부지 선정에서 지역 주민 동의와 국가적 필요가 충돌하면 어떻게 해야 합니까?','원전 혜택은 전국이 누리는데 폐기물 부담은 한 지역이 지는 것이 공정합니까?'],\n'도시 녹지와 열섬':['도심 재개발에서 주택 공급과 녹지 확보가 충돌하면 무엇을 우선하겠습니까?','폭염 취약계층을 위한 냉방비 지원은 복지입니까, 탄소 배출을 늘리는 정책입니까?'],\n'미중 패권 경쟁':['안보는 미국, 경제는 중국이라는 전략은 여전히 유효합니까?','미국의 대중 반도체 규제에 동참하는 것은 국익입니까, 경제적 자해입니까?'],\n'한일 관계':['과거사 문제와 경제·안보 협력은 분리해서 다뤄야 합니까?','한일 관계 개선을 위해 먼저 양보하는 것은 외교적 용기입니까, 굴욕입니까?'],\n'강제징용 배상 문제':['제3자 변제 해법은 현실적 외교입니까, 피해자의 권리를 정부가 대신 포기한 것입니까?','대법원 판결과 국가 간 협정이 충돌할 때 정부는 무엇을 따라야 합니까?'],\n'북핵 문제':['한국의 독자 핵무장은 생존 전략입니까, 국제적 고립을 부르는 선택입니까?','북한 비핵화가 불가능하다면 핵 동결로 목표를 바꿔야 합니까?'],\n'러시아-우크라이나 전쟁':['한국이 우크라이나에 살상 무기를 지원해야 합니까?','전쟁을 끝내기 위해 영토 양보를 포함한 협상을 수용해야 한다는 주장을 어떻게 봅니까?'],\n'중동 분쟁':['자위권과 민간인 보호가 충돌할 때 국제사회는 어떤 기준으로 판단해야 합니까?','한국 정부는 중동 분쟁에서 중립을 지켜야 합니까?'],\n'보호무역과 공급망':['자유무역의 혜택을 받은 한국이 보호무역에 맞서 관세로 대응해야 합니까?','공급망 안정을 위해 해외 공장을 국내로 되돌리는 리쇼어링에 보조금을 줘야 합니까?'],\n'공적개발원조(ODA)':['국내에도 빈곤층이 있는데 해외 원조를 늘리는 것이 정당합니까?','원조를 국익(수출·외교)과 연계하는 것은 옳습니까?'],\n'국제기구의 역할과 한계':['강대국의 거부권으로 기능이 마비된 UN은 여전히 필요합니까?','국제기구 결정이 국내 여론과 다를 때 국가는 무엇을 따라야 합니까?'],\n'이민 정책과 인구 위기':['이민청을 설립해 이민을 적극 받아들이는 것은 인구 위기 해법입니까, 사회 갈등의 시작입니까?','이민자에게 한국어 능력과 문화 적응을 조건으로 요구해야 합니까?'],\n'글로벌 식량 위기':['식량 안보를 위해 비효율적이라도 국내 농업을 보호해야 합니까?','식량 수출국이 수출을 제한하는 것은 정당한 자국 보호입니까?'],\n'기후 협약과 국제 협력':['개도국에도 선진국과 같은 감축 의무를 요구하는 것이 공정합니까?','한국은 선진국으로서 기후 재원을 더 부담해야 합니까?'],\n'인권 외교':['북한 인권 문제 제기가 남북 대화를 막는다면 침묵해야 합니까?','경제 파트너 국가의 인권 문제를 외교적으로 비판해야 합니까?'],\n'방위산업과 무기 수출':['분쟁 중인 국가에 무기를 수출하는 것은 국익입니까, 전쟁에 대한 책임 회피입니까?','방산 수출 확대가 한국을 군사 분쟁에 끌어들일 위험은 없습니까?'],\n'디지털 무역과 빅테크 과세':['국내에서 돈을 가짜뉴스와 미디어 리터러시':['허위정보를 법으로 처벌할 때 진위 판단 권한을 국가가 가져도 되는가','추천 알고리즘을 운영하는 플랫폼이 허위정보 확산에 법적 책임을 져야 하는가','미디어 리터러시 교육이 딥페이크 시대의 허위정보에 대응할 수 있는가'],\n'필수의료 공백과 의사 인력':['의대 정원 확대가 소아과·응급의학과 등 필수의료 인력 증가로 이어지는가','낮은 수가와 의료 소송 부담을 해소하지 않고 필수의료 기피를 해결할 수 있는가','지역 의사제처럼 근무지를 의무화하는 것이 직업 선택의 자유를 침해하는가'],\n'선거제도 개편':['준연동형 비례대표제가 위성정당 창당으로 무력화되었는가','소선거구제의 사표 문제가 대표성을 얼마나 왜곡하는가','중대선거구제 도입이 지역주의 완화에 효과적인가'],\n'정치 양극화와 팬덤정치':['강성 지지층이 정당의 공천과 정책 결정을 좌우하고 있는가','팬덤정치가 정치 참여 확대인가, 정치적 타협의 장애물인가','양극화를 완화할 제도적 장치(결선투표제 등)가 실효성이 있는가'],\n'청년 정치 참여':['피선거권 연령 하향 이후 청년 정치인의 실제 당선이 늘었는가','청년 공천 할당제가 대표성 확대인가, 능력과 무관한 특혜인가','청년 정치인이 청년 의제만 대변하는 것이 바람직한가'],\n'지방자치와 재정분권':['국세·지방세 비율 조정이 지자체 간 재정 격차를 키우는가','재정분권 확대가 지방정부의 선심성 사업을 늘리는가','지방교부세 중심 재정 구조가 지방의 자율성을 제약하는가'],\n'대통령제와 권력구조 개헌':['5년 단임제가 책임정치를 약화시키는가','4년 중임제가 권력 집중을 완화하는가, 강화하는가','분권형 대통령제가 한국 정당 구조에서 작동할 수 있는가'],\n'국회의원 특권 논란':['불체포특권이 권력 견제 장치로서 여전히 필요한가','국회의원 세비와 보좌진 규모가 업무에 비해 과도한가','면책특권이 허위 폭로의 방패로 악용되고 있는가'],\n'여론조사와 민주주의':['선거 전 6일간 여론조사 공표 금지가 유권자의 알 권리를 침해하는가','ARS 여론조사의 낮은 응답률이 결과의 신뢰성을 훼손하는가','여론조사가 밴드왜건 효과로 표심을 왜곡하는가'],\n'국민투표와 직접민주주의':['국민발안제가 대의제를 보완하는가, 다수의 횡포를 부르는가','국회의원 국민소환제가 소신 정치를 위축시키는가','온라인 국민청원이 실질적인 정책 변화로 이어졌는가'],\n'공직자 이해충돌 방지':['공직자의 직무 관련 부동산 보유를 제한하는 것이 재산권 침해인가','이해충돌방지법이 시행 이후 실제 적발과 처벌로 이어지고 있는가','고위공직자 주식 백지신탁 제도가 실효성이 있는가'],\n'정당 공천 제도':['당 지도부의 전략 공천이 정당민주주의에 반하는가','국민 경선이 인지도 높은 현역에게만 유리한가','공천 탈락자의 탈당·무소속 출마가 정당 정치를 약화시키는가'],\n'세대 갈등과 정치':['연금·부동산 정책에서 세대 간 이해가 실제로 충돌하는가','정치권이 득표를 위해 세대 갈등을 부추기고 있는가','고령 유권자 비중 증가가 청년 의제를 정치에서 밀어내는가'],\n'젠더 갈등과 정치':['청년층 젠더 갈등이 실제 차별 경험의 차이에서 비롯되는가','정당이 젠더 갈등을 선거 전략으로 이용하는 것이 정당한가','여성가족부 폐지·개편이 성평등 정책을 후퇴시키는가'],\n'남북관계와 통일 정책':['통일 비용과 편익 중 무엇이 더 큰가','정권마다 바뀌는 대북 정책이 남북관계를 불안정하게 만드는가','청년 세대의 통일 무관심이 통일 정책의 정당성을 약화시키는가'],\n'국방과 병역제도':['병역 자원 감소 속에서 현행 징병제를 유지할 수 있는가','모병제 전환이 저소득층 청년의 군 복무 집중을 부르는가','여성 징병제가 병역 형평성 확보의 수단이 될 수 있는가'],\n'행정수도와 균형발전':['대통령실과 국회의 세종 이전에 헌법 개정이 필요한가','행정 기능 분산이 업무 비효율을 키우는가','세종시가 수도권 인구 분산에 실제로 기여했는가'],\n'정치 후원금과 정치자금':['법인·단체의 정치 후원 금지가 정경유착 방지에 효과적인가','소액 후원 세액공제가 특정 정치인 팬덤만 강화하는가','정치자금 회계 공개 범위가 충분히 투명한가'],\n'공공기관 지방 이전':['이전 공공기관 직원의 가족 동반 이주율이 낮은 이유는 무엇인가','2차 공공기관 이전이 지역 경제에 실질적 효과를 낼 수 있는가','기관 이전으로 인한 업무 효율 저하를 감수할 만한가'],\n'정치 유튜브와 여론':['수익을 위해 극단적 주장을 하는 정치 유튜브를 규제해야 하는가','정치 유튜브가 확증편향을 강화해 여론을 양극화하는가','허위 정치 콘텐츠에 대한 플랫폼의 책임 범위는 어디까지인가'],\n'시민단체의 역할과 책임':['정부 보조금을 받는 시민단체가 정부를 독립적으로 견제할 수 있는가','시민단체 회계 감사 강화가 비판 세력 통제로 이어지는가','일부 단체의 회계 부정이 시민사회 전체의 신뢰를 훼손했는가'],\n'최저임금 인상':['급격한 최저임금 인상이 저임금 일자리를 줄였는가','업종·지역별 최저임금 차등 적용이 타당한가','최저임금 인상 부담을 자영업자에게만 지우는 것이 공정한가'],\n'부동산 가격과 주거 불평등':['주택 공급 확대와 수요 억제 중 집값 안정에 더 효과적인 것은 무엇인가','다주택자 중과세가 시장에 매물을 늘렸는가, 증여로 이어졌는가','청년·신혼부부 특별공급이 다른 무주택자에 대한 역차별인가'],\n'가계부채':['DSR 규제 강화가 금융 안정인가, 실수요자의 내 집 마련 제한인가','변동금리 대출 비중이 높은 구조가 금리 인상기에 위험을 키우는가','채무 조정·탕감 정책이 도덕적 해이를 부르는가'],\n'기본소득':['같은 예산으로 보편 지급과 선별 복지 중 빈곤 감소 효과가 큰 것은 무엇인가','기본소득이 근로 의욕을 떨어뜨리는가','기본소득 재원을 증세 없이 마련할 수 있는가'],\n'주 4일제와 노동시간':['노동시간 단축이 생산성 향상으로 이어지는가','주 4일제가 대기업 정규직에게만 적용되어 격차를 키우는가','임금 삭감 없는 노동시간 단축이 중소기업에서 가능한가'],\n'정규직·비정규직 격차':['같은 일을 하는 정규직·비정규직 간 임금 격차가 정당화될 수 있는가','공공기관 비정규직의 정규직 전환이 공채 입사자에 대한 역차별인가','정규직 해고 요건 완화가 비정규직 감소로 이어지는가'],\n'청년 실업과 니트족':['청년 실업이 일자리 부족 때문인가, 일자리 미스매치 때문인가','구직 단념 청년에 대한 현금 지원이 자립을 돕는가','대기업·공기업 쏠림이 청년 고용 문제를 악화시키는가'],\n'재벌 개혁과 대기업 집중':['재벌 규제 강화가 기업의 글로벌 경쟁력을 약화시키는가','총수 일가의 경영 승계를 규제할 근거가 있는가','대기업 중심 성장 모델이 중소기업 성장을 가로막는가'],\n'중소기업과 하도급':['납품단가 연동제가 원자재 가격 상승 부담을 공정하게 나누는가','하청 노동자가 원청과 직접 교섭할 권리를 가져야 하는가','기술 탈취 등 원청의 불공정 행위를 막을 실효적 수단은 무엇인가'],\n'자영업 위기':['OECD 최상위 수준의 자영업 비중이 과밀 경쟁을 부르는가','배달 플랫폼 수수료를 정부가 규제해야 하는가','자영업 폐업자에 대한 사회안전망이 충분한가'],\n'저성장과 잠재성장률 하락':['잠재성장률 1%대 하락이 인구 구조상 불가피한가','규제 완화와 복지 확대 중 저성장 극복에 우선해야 할 것은 무엇인가','성장률보다 삶의 질을 정책 목표로 삼는 것이 현실적인가'],\n'조세 정의와 부자 감세':['최고세율 50%의 상속세가 기업 승계를 가로막는가','법인세 인하가 투자와 고용 증가로 이어졌는가','종합부동산세가 부동산 투기 억제에 효과적이었는가'],\n'가상자산과 투자 규제':['가상자산 소득 과세를 투자자 보호 제도보다 먼저 시행하는 것이 타당한가','가상자산을 제도권 금융상품으로 인정해야 하는가','코인 거래소 상장·폐지 기준을 누가 감독해야 하는가'],\n'금융 문맹과 청년 투자':['청년층의 영끌·빚투를 국가가 규제할 근거가 있는가','학교 금융 교육 의무화가 투자 손실을 줄일 수 있는가','청년 자산 형성 지원 상품이 세대 간 형평에 맞는가'],\n'물가 상승과 생활비 위기':['물가 안정을 위한 금리 인상이 서민의 이자 부담을 키우는가','공공요금 인상 억제가 공기업 부실을 키우는가','고물가 대책으로 보편 지원과 취약계층 선별 지원 중 무엇이 효과적인가'],\n'중대재해처벌법':['중대재해처벌법 시행 이후 산재 사망자가 실제로 줄었는가','경영 책임자 형사처벌이 현장 안전 투자보다 효과적인가','50인 미만 사업장 적용이 중소기업에 과도한 부담인가'],\n'이민과 외국인 노동자':['외국인 노동자 확대가 내국인 저임금 일자리를 잠식하는가','외국인 가사·돌봄 노동자에게 최저임금을 다르게 적용할 수 있는가','고용허가제의 사업장 변경 제한이 강제노동에 해당하는가'],\n'공기업 효율화와 민영화':['철도·전력 민영화가 효율성을 높이는가, 공공성을 해치는가','공기업 적자를 요금 인상과 세금 지원 중 무엇으로 메워야 하는가','공기업 경영 평가가 단기 실적 위주로 왜곡되었는가'],\n'고령화와 노인 돌봄':['노인 돌봄의 1차 책임이 가족에게 있는가, 국가에 있는가','요양보호사의 낮은 임금이 돌봄 인력 부족의 원인인가','외국인 돌봄 인력 도입이 돌봄 노동 저평가를 고착시키는가'],\n'1인 가구 증가':['4인 가구 기준 주거·조세 정책이 1인 가구를 차별하는가','1인 가구 지원 정책이 저출산 대책과 충돌하는가','1인 가구 증가가 개인의 선택인가, 경제적 강요인가'],\n'고독사와 사회적 고립':['국가가 고립 위험 가구를 찾아내 개입하는 것이 사생활 침해인가','청년 은둔형 외톨이 지원에 현금 지원이 효과적인가','고독사 증가가 가족 해체의 결과인가, 복지 사각지대의 결과인가'],\n'학교폭력':['학교폭력 가해 기록의 대입 반영이 정당한 책임인가, 이중 처벌인가','학폭 사안 처리를 교사가 아닌 외부 전담 조직이 맡아야 하는가','가해 학생의 학습권과 피해 학생의 분리 요구가 충돌할 때 무엇을 우선해야 하는가'],\n'교권 침해':['학생인권조례가 교권 침해를 늘렸는가','학부모의 악성 민원을 법으로 제재할 수 있는가','교사의 생활지도 권한 강화가 학생 인권을 위축시키는가'],\n'청소년 정신건강':['청소년 SNS 이용을 법으로 제한하는 것이 타당한가','입시 경쟁이 청소년 우울·자해 증가의 주된 원인인가','학교 상담 인력 부족이 정신건강 위기 대응을 늦추는가'],\n'자살률 문제':['OECD 최고 자살률의 주된 원인이 경제적 요인인가, 사회적 고립인가','자살 예방 예산이 자살률 감소에 비례하는 효과를 냈는가','자살 보도 가이드라인이 모방 자살을 줄이는가'],\n'장애인 이동권':['출근길 지하철 시위가 정당한 권리 행사의 범위 안에 있는가','모든 지하철역 엘리베이터 설치를 예산과 무관하게 보장해야 하는가','특별교통수단 부족이 장애인의 사회 참여를 제한하는가'],\n'다문화 가정과 차별':['다문화 가정 대상 별도 지원이 오히려 구분짓기를 강화하는가','이주민에게 한국어·문화 적응을 요구하는 것이 동화 강요인가','다문화 가정 자녀의 낮은 대학 진학률이 구조적 차별의 결과인가'],\n'성평등과 유리천장':['기업 임원 여성 할당제가 구조적 차별 해소인가, 능력주의 위반인가','OECD 최대 수준의 성별 임금 격차가 차별의 결과인가, 직종·근속 차이의 결과인가','육아휴직 사용률의 성별 격차가 여성 경력 단절을 고착시키는가'],\n'채용 공정성':['블라인드 채용이 학벌 차별을 줄였는가, 기업의 인재 검증을 어렵게 했는가','공공기관 지역인재 의무채용이 수도권 출신에 대한 역차별인가','부정청탁으로 합격한 사람의 채용을 본인이 몰랐더라도 취소해야 하는가'],\n'능력주의 논쟁':['능력에 따른 보상이 출발선의 불평등을 고려하지 않는다면 공정한가','시험 중심 선발이 가장 공정한 방식인가','결과의 평등을 위한 정책이 노력의 동기를 약화시키는가'],\n'동물권과 반려동물':['동물에게 법적 권리를 인정할 근거가 있는가','개식용 금지가 동물권의 진전인가, 국가의 식문화 강제인가','반려동물 보유세 도입이 유기 동물 감소에 효과적인가'],\n'노키즈존':['노키즈존이 영업의 자유인가, 아동에 대한 차별인가','특정 연령 집단 출입 금지를 법으로 막아야 하는가','노키즈존 확산이 아동 혐오를 조장하는가'],\n'층간소음과 공동주택 갈등':['층간소음의 주된 책임이 건설사의 시공 기준에 있는가, 거주자에게 있는가','바닥 충격음 기준 미달 시 준공 불허가 과도한 규제인가','이웃 분쟁 조정 제도가 실효성이 있는가'],\n'마약 확산':['마약 투약자를 처벌 대상으로 볼 것인가, 치료 대상으로 볼 것인가','10대·20대 마약 사범 증가가 온라인 유통 구조 때문인가','의료용 대마 허용 범위를 넓혀야 하는가'],\n'의대 쏠림과 입시':['최상위권의 의대 쏠림이 개인의 합리적 선택인가, 국가가 바로잡아야 할 왜곡인가','의대 정원 확대가 이공계 인재 유출을 가속하는가','의사의 높은 기대 소득이 쏠림의 근본 원인인가'],\n'대학 구조조정':['정원 미달 지방대를 시장 원리로 퇴출시켜야 하는가','대학 통폐합이 교육의 질을 높이는가, 지역 교육 기회를 줄이는가','글로컬대학 같은 선택과 집중 지원이 대학 간 격차를 키우는가'],\n'사형제 존폐':['오판 가능성이 있는 상황에서 사형제를 유지할 수 있는가','사형제가 흉악 범죄 억지 효과를 가지는가','30년 가까이 집행하지 않은 사형제를 존치하는 것이 의미 있는가'],\n'안락사와 조력존엄사':['조력존엄사가 자기결정권의 실현인가, 생명권 경시인가','완화의료가 충분하지 않은 상황에서 조력사를 허용하는 것이 타당한가','조력사 허용이 장애인·노인에게 죽음을 선택하라는 압박이 되는가'],\n'낙태죄 헌법불합치 이후':['헌법불합치 결정 이후 입법 공백이 의료 현장의 혼란을 낳고 있는가','임신 주수에 따른 허용 기준을 어디에 두어야 하는가','태아의 생명권과 여성의 자기결정권 중 무엇을 우선해야 하는가'],\n'차별금지법':['포괄적 차별금지법이 종교·양심의 자유를 침해하는가','개별 차별금지법이 있는데 포괄법이 추가로 필요한가','성적 지향을 차별 금지 사유에 포함해야 하는가'],\n'성범죄와 디지털 성범죄':['딥페이크 성착취물의 단순 소지·시청까지 처벌하는 것이 과도한가','디지털 성범죄 수사를 위한 위장 수사 확대가 인권 침해 소지가 있는가','텔레그램 등 해외 플랫폼에 국내법을 적용할 수 있는가'],\n'스토킹 처벌':['스토킹 반의사불벌죄 폐지가 피해자의 의사를 무시하는가','유죄 확정 전 가해자 전자발찌 부착이 과잉 제재인가','접근금지 명령 위반에 대한 처벌이 실효성이 있는가'],\n'음주운전 처벌':['윤창호법 이후 음주운전 재범률이 실제로 줄었는가','상습 음주운전자의 차량 몰수가 재산권 침해인가','음주운전 방지 장치 의무 장착이 효과적인 대안인가'],\n'사이버 명예훼손':['사실을 적시해도 처벌하는 명예훼손죄가 표현의 자유를 과도하게 제한하는가','악성 댓글 방지를 위한 인터넷 실명제 부활이 타당한가','공인에 대한 비판과 명예훼손의 경계는 어디인가'],\n'개인정보 보호':['개인정보 유출 기업에 전체 매출 기준 과징금을 부과하는 것이 적정한가','개인정보 활용 규제 완화가 데이터 산업 혁신에 필수적인가','정보 주체의 동의 제도가 형식화되어 실효성을 잃었는가'],\n'검찰 개혁과 수사권 조정':['검찰의 수사권과 기소권을 완전히 분리해야 하는가','검경 수사권 조정 이후 사건 처리 지연이 심화되었는가','공수처가 고위공직자 범죄 수사에서 실효성을 보였는가'],\n'전관예우':['퇴직 판검사의 사건 수임 제한 기간을 늘려야 하는가','전관예우가 실제 판결에 영향을 미친다는 근거가 있는가','대법관 퇴임 후 변호사 개업을 제한하는 것이 직업의 자유 침해인가'],\n'국민참여재판':['배심원 평결에 법적 구속력을 부여해야 하는가','여론이 집중된 사건에서 배심원이 공정할 수 있는가','피고인만 신청할 수 있는 현행 제도를 바꿔야 하는가'],\n'양심적 병역거부':['교도소 36개월 합숙 대체복무가 징벌적 성격을 띠는가','대체복무 기간을 현역보다 길게 하는 것이 형평에 맞는가','종교 외 신념에 따른 병역거부를 어디까지 인정해야 하는가'],\n'신상공개 제도':['피의자 단계 신상공개가 무죄추정 원칙에 반하는가','신상공개 대상과 기준이 사건마다 자의적으로 적용되는가','신상공개가 범죄 억지 효과를 가지는가'],\n'사적 제재와 디지털 교도소':['사적 제재 확산이 사법 불신의 결과인가','신상 폭로로 인한 오인 피해를 어떻게 구제할 것인가','사적 제재 콘텐츠로 수익을 얻는 유튜버를 처벌해야 하는가'],\n'저작권과 AI':['창작자 동의 없는 AI 학습이 공정이용에 해당하는가','AI 생성물에 저작권을 인정할 수 있는가','AI 학습 데이터에 대한 보상 체계를 법으로 마련해야 하는가'],\n'동물학대 처벌':['동물을 물건으로 규정한 민법을 개정해야 하는가','동물학대 처벌이 실형 선고로 이어지지 않는 이유는 무엇인가','학대자의 동물 사육 금지 명령이 필요한가'],\n'직장 내 괴롭힘':['직장 내 괴롭힘의 법적 기준이 모호해 정당한 업무 지시까지 위축시키는가','5인 미만 사업장을 괴롭힘 금지법 적용에서 제외하는 것이 타당한가','신고 후 2차 피해를 막을 장치가 충분한가'],\n'K-콘텐츠와 문화 산업':['정부 주도 콘텐츠 지원이 창작 자율성을 해치는가','글로벌 OTT 투자가 국내 제작사의 지식재산권을 빼앗고 있는가','K-팝 산업의 연습생·아티스트 노동 환경이 공정한가'],\n'OTT와 방송 산업 변화':['OTT에도 지상파 수준의 내용 심의를 적용해야 하는가','글로벌 OTT에 망 사용료를 부과하는 것이 정당한가','지상파의 광고 규제를 OTT 수준으로 완화해야 하는가'],\n'공영방송의 독립성':['TV 수신료 분리징수가 공영방송의 재정 독립성을 훼손하는가','공영방송 이사 추천권을 정치권에서 분리할 수 있는가','공영방송이 상업방송과 다른 역할을 하고 있는가'],\n'언론 자유와 언론중재법':['허위 보도에 징벌적 손해배상을 도입하면 권력 감시 보도가 위축되는가','언론사의 정정보도 크기·위치를 법으로 정하는 것이 타당한가','언론 자유가 언론사의 자유인가, 시민의 알 권리인가'],\n'알고리즘과 필터버블':['추천 알고리즘 공개 의무화가 영업비밀 침해인가','필터버블의 책임이 플랫폼에 있는가, 이용자에게 있는가','알고리즘 추천을 끌 수 있는 선택권을 의무화해야 하는가'],\n'숏폼 콘텐츠와 문해력':['숏폼 소비 증가가 청소년 문해력 저하의 원인인가','청소년 숏폼 이용 시간을 제한하는 것이 과잉 규제인가','숏폼이 새로운 정보 습득 방식으로서 교육적 가치가 있는가'],\n'게임 중독과 게임 산업':['WHO의 게임이용장애 질병코드를 국내에 도입해야 하는가','게임 확률형 아이템이 사행성 규제 대상인가','게임 중독의 책임이 이용자에게 있는가, 중독을 유도하는 설계에 있는가'],\n'문화유산 보존과 개발':['문화재 보호구역 개발 제한이 주민 재산권을 과도하게 침해하는가','관광을 위한 문화유산 복원이 원형을 훼손하는가','문화유산 보존 비용을 지역이 부담해야 하는가, 국가가 부담해야 하는가'],\n'문화 다양성':['스크린 쿼터 같은 자국 문화 보호 정책이 여전히 필요한가','외국 문화 유입이 고유문화를 약화시키는가','문화 다양성 지원이 소수 문화의 자생력을 키우는가'],\n'팬덤 문화':['앨범 대량 구매를 유도하는 마케팅이 과소비를 조장하는가','팬덤의 집단 압력이 기업·아티스트의 결정을 좌우하는 것이 정당한가','팬덤 내 사생활 침해를 법으로 규제해야 하는가'],\n'외모지상주의':['채용 시 사진 제출 금지가 외모 차별을 줄이는가','미디어의 획일적 미의 기준이 외모 강박을 만드는가','외모 관리가 개인의 자유인가, 사회적 강요인가'],\n'혐오 표현과 밈 문화':['특정 집단을 조롱하는 밈을 유머로 볼 수 있는가','혐오 밈 삭제가 플랫폼의 정당한 운영인가, 검열인가','밈의 확산이 혐오에 대한 무감각을 키우는가'],\n'출판·독서 문화 위기':['도서정가제가 동네 서점과 출판 생태계를 보호하는가','성인 독서율 하락이 사회적 위기인가','공공도서관 예산 확대가 독서율 회복에 효과적인가'],\n'스포츠와 공정':['트랜스젠더 선수의 여성부 경기 출전이 공정한가','엘리트 체육의 성적 중심 구조가 폭력을 낳는가','비디오 판독 확대가 심판의 권위를 약화시키는가'],\n'지역 문화 격차':['지역 대형 문화시설 건립이 격차 해소인가, 전시 행정인가','문화 예산을 인구 비례로 배분해야 하는가','지역 문화 격차가 청년 유출의 원인이 되는가'],\n'관광과 오버투어리즘':['관광객에게 입장료·관광세를 부과하는 것이 정당한가','관광 수입과 주민의 주거권 중 무엇을 우선해야 하는가','단기 숙박 공유를 제한해야 하는가'],\n'종교와 사회':['종교인 과세 범위를 일반 근로소득 수준으로 확대해야 하는가','종교 단체의 정치적 발언이 정교분리에 위배되는가','종교 단체의 집단 행사를 공중보건을 이유로 제한할 수 있는가'],\n'인플루언서와 뒷광고':['뒷광고를 형사처벌 대상으로 삼아야 하는가','광고 표시 의무를 플랫폼과 인플루언서 중 누가 져야 하는가','인플루언서의 허위 후기로 인한 소비자 피해를 어떻게 구제할 것인가'],\n'저작권과 불법 복제':['불법 사이트 접속 차단이 인터넷 검열에 해당하는가','불법 복제물 이용자까지 처벌해야 하는가','해외 서버 기반 불법 사이트를 국내법으로 규제할 수 있는가'],\n'자율주행차와 책임':['자율주행 사고의 책임이 제조사, 운전자, 소프트웨어 개발자 중 누구에게 있는가','사고 불가피 상황에서 탑승자와 보행자 중 누구를 보호하도록 설계해야 하는가','자율주행 데이터 공개 범위를 어디까지 의무화해야 하는가'],\n'AI 윤리와 규제':['AI 사전 규제가 기술 혁신을 저해하는가','채용·대출 심사에 AI를 사용하는 것이 차별을 줄이는가, 키우는가','AI의 판단 근거를 설명할 의무를 기업에 부과해야 하는가'],\n'딥페이크 기술':['딥페이크 생성 도구 자체를 규제해야 하는가, 악용만 처벌해야 하는가','정치인 풍자 딥페이크가 표현의 자유로 보호되어야 하는가','AI 생성물에 워터마크 표시를 의무화해야 하는가'],\n'유전자 편집':['치료 목적의 배아 유전자 편집을 허용해야 하는가','치료와 능력 향상의 경계를 법으로 구분할 수 있는가','유전자 편집 기술이 새로운 계층 불평등을 만드는가'],\n'원격의료':['비대면 진료 확대가 의료 접근성을 높이는가, 오진 위험을 키우는가','비대면 진료가 대형병원 쏠림을 심화시키는가','처방약 배송을 허용해야 하는가'],\n'감염병 대응과 공중보건':['감염병 위기 시 개인 위치정보 수집이 정당한가','방역 패스가 백신 미접종자에 대한 차별인가','영업 제한 손실을 국가가 어디까지 보상해야 하는가'],\n'우주 개발':['복지 수요가 큰 상황에서 우주 개발 예산 확대가 정당한가','우주 개발을 국가 주도에서 민간 주도로 전환해야 하는가','우주항공청이 실질적 성과를 낼 조직 구조를 갖췄는가'],\n'반도체 산업 경쟁':['반도체 대기업에 대한 보조금·세액공제가 대기업 특혜인가','반도체 연구 인력에 주 52시간 예외를 허용해야 하는가','미국·중국 사이에서 공급망 선택을 강요받는 상황에 어떻게 대응해야 하는가'],\n'데이터 3법과 빅데이터':['가명정보의 동의 없는 활용이 정보 주체의 권리를 침해하는가','의료 데이터의 산업적 활용을 허용해야 하는가','가명정보 재식별 위험을 기술적으로 통제할 수 있는가'],\n'사이버 보안':['국가 사이버 안보를 위해 정보기관의 민간 통신 감시를 확대해야 하는가','랜섬웨어 피해 기업의 몸값 지불을 금지해야 하는가','해킹 사고 기업에 대한 처벌이 보안 투자를 늘리는가'],\n'로봇과 일자리 자동화':['로봇세가 자동화 실업 대책의 재원이 될 수 있는가','자동화로 인한 실업 대응 책임이 개인에게 있는가, 국가에 있는가','서비스업 무인화가 고령층 일자리를 빠르게 줄이는가'],\n'플랫폼 독점':['거대 플랫폼 사전 규제가 국내 기업만 묶는 역차별인가','무료 서비스를 제공하는 플랫폼의 독점이 소비자 후생을 해치는가','플랫폼의 자사 우대 행위를 금지해야 하는가'],\n'기초과학 투자와 R&D':['단기 성과가 불확실한 기초과학에 세금을 투입하는 것이 정당한가','R&D 예산 삭감이 낭비 제거인가, 연구 생태계 붕괴인가','연구 과제 평가가 성공률 위주로 왜곡되어 도전적 연구를 막는가'],\n'이공계 인재 유출':['이공계 인재의 해외 유출 원인이 연봉인가, 연구 환경인가','이공계 병역특례 확대가 인재 유출을 막는가','의대 쏠림이 이공계 기피의 결과인가, 원인인가'],\n'메타버스와 가상세계':['아바타 대상 성희롱을 현실의 성범죄처럼 처벌할 수 있는가','가상 자산 거래에 현실 금융 규제를 적용해야 하는가','메타버스 산업 지원이 지속 가능한 투자인가'],\n'디지털 중독':['학교 내 스마트폰 사용 전면 금지가 타당한가','중독을 유도하는 앱 설계에 기업 책임을 물을 수 있는가','청소년 SNS 가입 연령 제한이 실효성이 있는가'],\n'의약품 접근성과 신약 가격':['수억 원대 초고가 신약에 건강보험을 적용해야 하는가','제약사의 특허권과 환자의 접근권이 충돌할 때 무엇을 우선해야 하는가','약가 인하 압박이 신약 출시 지연을 부르는가'],\n'원자력 발전':['원전 확대가 탄소중립과 에너지 안보를 위한 현실적 선택인가','원전 사고의 낮은 확률을 감수할 만한 위험으로 볼 수 있는가','원전 수출 확대가 국가 전략 산업으로 타당한가'],\n'재생에너지 전환':['재생에너지 확대에 따른 전기요금 인상을 국민이 감수해야 하는가','산지 태양광 설치가 친환경 정책에 부합하는가','송전망 부족 문제를 해결하지 않고 재생에너지를 늘릴 수 있는가'],\n'플라스틱 쓰레기':['일회용컵 보증금제가 소상공인에게 부담만 지우는가','플라스틱 생산 기업에 처리 비용을 부담시켜야 하는가','국제 플라스틱 협약의 생산 감축 목표가 현실적인가'],\n'미세먼지':['국내 미세먼지 중 국외 유입 비중을 고려할 때 국내 대책이 효과적인가','노후 경유차 운행 제한이 서민에게 부담을 전가하는가','미세먼지 계절관리제가 실질적인 저감 효과를 냈는가'],\n'후쿠시마 오염수 방류':['국제원자력기구의 안전성 평가를 그대로 신뢰할 수 있는가','과학적 안전성과 국민 불안이 충돌할 때 정부는 무엇을 기준으로 대응해야 하는가','수산업 피해 보상을 누가 책임져야 하는가'],\n'탄소세와 배출권 거래제':['탄소세가 서민과 제조업에 부담을 전가하는가','배출권 무상 할당이 감축 유인을 약화시키는가','탄소세 수입을 국민 배당으로 돌려주는 것이 바람직한가'],\n'기후 소송과 미래세대':['헌법재판소의 탄소중립기본법 헌법불합치 결정이 사법의 정책 개입인가','미래 세대의 환경권을 현재 세대가 어떻게 보장할 수 있는가','2031년 이후 감축 목표 부재가 기본권 침해에 해당하는가'],\n'이상기후와 재난 대응':['반지하 등 재난 취약 주거를 금지하는 것이 주거권 보호인가, 침해인가','기후 재난 피해를 국가가 어디까지 보상해야 하는가','지자체의 재난 대응 역량 격차를 어떻게 해소할 것인가'],\n'물 부족과 수자원':['수도 요금 인상으로 물 사용을 줄이는 것이 기본권을 시장에 맡기는 것인가','신규 댐 건설이 물 부족 해법인가, 환경 파괴인가','지역 간 물 배분 갈등을 누가 조정해야 하는가'],\n'생물다양성 감소':['멸종위기종 서식지 보호를 위해 개발 사업을 중단할 수 있는가','국토의 30% 보호구역 지정 목표가 현실적인가','보호 비용을 지역 주민에게 부담시키는 것이 공정한가'],\n'전기차 전환':['생산·전력 생산 과정까지 고려할 때 전기차가 실제로 친환경인가','내연기관차 판매 금지 시점을 법으로 정해야 하는가','전기차 보조금이 고소득층에게 더 많이 돌아가는가'],\n'그린워싱':['그린워싱 처벌 강화가 기업의 친환경 시도를 위축시키는가','친환경 인증 기준을 정부가 통일해야 하는가','소비자에게 친환경 마케팅 판별 책임이 있는가'],\n'음식물 쓰레기와 식량 낭비':['유통기한 대신 소비기한 표시제가 식량 낭비를 줄였는가','식품 기부 시 기업의 민사 책임을 면제해야 하는가','음식물 쓰레기 종량제 요금 인상이 효과적인가'],\n'기후 난민':['기후 난민을 국제법상 난민으로 인정해야 하는가','탄소 배출 책임이 큰 선진국이 기후 난민을 더 수용해야 하는가','기후 이주를 예방하기 위한 적응 지원이 충분한가'],\n'개발과 환경 보존':['지역 주민이 원하는 개발 사업을 환경 보호를 이유로 막을 수 있는가','환경영향평가가 사업자 비용으로 이루어져 형식화되었는가','신공항 건설의 경제 효과가 환경 비용을 정당화하는가'],\n'비건과 육식 문화':['육류 소비 감축을 위한 육류세 도입이 정당한가','학교 급식 채식 선택권을 의무화해야 하는가','대체육이 축산업 일자리를 위협하는가'],\n'에너지 요금 현실화':['원가에 못 미치는 전기요금을 현실화하는 것이 서민 부담 가중인가','한전 적자를 요금 인상과 세금 투입 중 무엇으로 메워야 하는가','산업용 전기요금 할인이 대기업 특혜인가'],\n'핵폐기물 처분장':['고준위 방폐장 부지 선정에서 주민 동의를 어떻게 확보할 것인가','원전 혜택은 전국이 누리고 폐기물 부담은 특정 지역이 지는 것이 공정한가','부지 확보 전 원전 가동 연장이 미래 세대에 부담을 떠넘기는가'],\n'도시 녹지와 열섬':['도심 재개발에서 주택 공급과 녹지 확보 중 무엇을 우선해야 하는가','폭염 취약계층 냉방비 지원이 탄소 배출 증가와 모순되는가','건물 옥상 녹화 의무화가 비용 대비 효과적인가'],\n'미중 패권 경쟁':['안보는 미국, 경제는 중국이라는 전략이 여전히 유효한가','미국의 대중 반도체 수출 규제에 동참하는 것이 국익에 맞는가','중국 의존도가 높은 핵심 광물 공급망을 다변화할 수 있는가'],\n'한일 관계':['과거사 문제와 경제·안보 협력을 분리해 다룰 수 있는가','한일 관계 개선을 위한 선제적 양보가 외교적 실익을 가져왔는가','한미일 안보 협력 강화가 중국·북한과의 긴장을 키우는가'],\n'강제징용 배상 문제':['제3자 변제 해법이 피해자의 권리를 정부가 대신 처분한 것인가','2018년 대법원 배상 판결과 1965년 청구권협정이 충돌하는가','일본 기업의 직접 배상 없이 문제가 종결될 수 있는가'],\n'북핵 문제':['한국의 독자 핵무장이 억지력 확보인가, 국제적 고립을 부르는가','북한 비핵화 목표를 핵 동결로 전환해야 하는가','대북 제재가 북한의 핵 개발을 늦췄는가'],\n'러시아-우크라이나 전쟁':['한국이 우크라이나에 살상 무기를 지원해야 하는가','영토 양보를 포함한 휴전 협상이 정당한가','북한군 파병이 한반도 안보에 어떤 위협이 되는가'],\n'중동 분쟁':['자위권 행사와 민간인 보호가 충돌할 때 국제법은 어떤 기준을 제시하는가','가자지구 인도주의 위기에 대한 국제사회의 대응이 충분한가','한국이 중동 분쟁에서 중립을 유지하는 것이 국익에 맞는가'],\n'보호무역과 공급망':['미국의 관세 인상에 한국이 보복 관세로 대응해야 하는가','리쇼어링 기업 보조금이 공급망 안정에 효과적인가','수출 의존 경제가 보호무역 시대에 지속 가능한가'],\n'공적개발원조(ODA)':['국내 빈곤층이 있는 상황에서 ODA 확대가 정당한가','원조를 수출·외교 등 국익과 연계하는 것이 바람직한가','ODA 예산 삭감이 국제적 신뢰를 훼손하는가'],\n'국제기구의 역할과 한계':['상임이사국의 거부권으로 UN 안보리가 기능을 잃었는가','국제기구 권고가 국내 여론과 다를 때 무엇을 따라야 하는가','국제기구 분담금 증액이 한국의 국제적 위상에 기여하는가'],\n'이민 정책과 인구 위기':['이민청 설립이 인구 위기 대응에 필요한가','이민 확대가 사회 통합 비용을 감당할 만한가','이민자에게 한국어 능력을 영주 조건으로 요구해야 하는가'],\n'글로벌 식량 위기':['식량 안보를 위해 비효율적인 국내 농업을 보호해야 하는가','식량 수출국의 수출 제한이 정당한 자국 보호인가','곡물 자급률 20%대인 한국이 식량 위기에 대비 \n'지방자치와 재정분권':['지방정부의 권한과 재원을 넓히는 재정분권이 지역 자율성을 높이는 동시에 책임성 확보 과제를 안고 있다.','재정분권|지방소비세|지방교부세'],\n'대통령제와 권력구조 개헌':['제왕적 대통령제에 대한 비판 속에 4년 중임제와 분권형 대통령제로의 개헌 논의가 반복되고 있다.','4년 중임제 개헌|제왕적 대통령제|분권형 개헌'],\n'국회의원 특권 논란':['불체포특권과 면책특권, 세비 등 국회의원 특권이 국민 눈높이에 맞지 않는다는 폐지 요구가 커지고 있다.','불체포특권 포기|국회의원 특권 내려놓기|체포동의안'],\n'여론조사와 민주주의':['선거 여론조사의 정확성과 표본 편향 문제가 불거지면서 공표 규제와 품질 관리의 필요성이 제기되고 있다.','선거 여론조사 신뢰도|여론조사 공표 금지|ARS 여론조사'],\n'국민투표와 직접민주주의':['국민발안과 국민소환 등 직접민주주의 제도를 확대해 대의제의 한계를 보완하자는 논의가 이어지고 있다.','국민발안제|국민소환제|국민투표법 헌법불합치'],\n'공직자 이해충돌 방지':['LH 땅 투기 사태를 계기로 이해충돌방지법이 시행됐지만 공직자 윤리 확보의 실효성 논란은 계속되고 있다.','이해충돌방지법|LH 땅 투기|공직자 부동산 투기'],\n'정당 공천 제도':['밀실 공천과 공천 갈등이 반복되면서 상향식 경선 등 정당 공천의 민주성을 높이는 방안이 논의되고 있다.','공천 갈등|상향식 공천|국민경선'],\n'세대 갈등과 정치':['연금·부동산·일자리 문제에서 세대 간 이해가 충돌하면서 정치가 세대 갈등을 조정하는지 증폭하는지가 논란이다.','세대 갈등|MZ세대 정치|연금 세대 갈등'],\n'젠더 갈등과 정치':['청년층의 젠더 갈등이 선거 쟁점으로 떠오르면서 정치권이 갈등을 조정하기보다 동원한다는 비판이 나온다.','젠더 갈등 선거|이대남 이대녀|여성가족부 폐지'],\n'남북관계와 통일 정책':['정권마다 대북 정책이 바뀌는 가운데 청년 세대의 통일 필요성 인식이 낮아지며 통일 정책의 방향이 재검토되고 있다.','대북정책|통일 필요성 인식|두 국가론'],\n'국방과 병역제도':['인구 감소로 병역 자원이 줄어들면서 모병제 전환과 여성 징병제 도입 논의가 본격화되고 있다.','병역자원 감소|모병제 전환|여성 징병제'],\n'행정수도와 균형발전':['세종 행정수도 완성을 위한 국회 세종의사당과 대통령 제2집무실 이전이 균형발전 효과를 낼지 논란이다.','행정수도 세종|국회 세종의사당|대통령 세종집무실'],\n'정치 후원금과 정치자금':['정치자금의 불투명한 흐름과 쪼개기 후원 문제로 정치자금법의 투명성 강화와 소액 후원 활성화가 요구되고 있다.','정치자금법 위반|쪼개기 후원|정치 후원금'],\n'공공기관 지방 이전':['1차 공공기관 이전의 성과 평가가 엇갈리는 가운데 2차 공공기관 이전이 지역 정착으로 이어질지 주목된다.','2차 공공기관 이전|혁신도시|공공기관 지방 이전'],\n'정치 유튜브와 여론':['정치 유튜버와 뉴미디어가 여론 형성에 큰 영향을 미치면서 확증편향과 허위정보 확산에 대한 우려가 커지고 있다.','정치 유튜버|유튜브 확증편향|사이버 렉카'],\n'시민단체의 역할과 책임':['시민단체의 보조금 사용과 회계 투명성 논란이 불거지면서 권력 견제 기능과 책임성 사이의 균형이 쟁점이 되고 있다.','시민단체 보조금|비영리단체 회계 투명성|정의연 회계'],\n'최저임금 인상':['최저임금 인상이 저임금 노동자의 소득을 높이는 한편 자영업자 부담과 고용 감소를 낳는다는 논쟁이 매년 반복된다.','최저임금 인상|최저임금 업종별 차등|최저임금위원회'],\n'부동산 가격과 주거 불평등':['집값 급등으로 청년과 무주택자의 주거 사다리가 끊기면서 부동산이 자산 불평등의 핵심 원인이 되고 있다.','집값 상승 주거 불평등|무주택 청년|부동산 대책'],\n'가계부채':['국내총생산에 맞먹는 가계부채가 고금리 상황에서 금융 시스템과 가계 소비를 위협하는 위험 요인이 되고 있다.','가계부채|DSR 규제|가계대출 증가'],\n'기본소득':['모든 국민에게 조건 없이 현금을 지급하는 기본소득이 복지 사각지대 해소책인지 재정 낭비인지 논쟁이 이어지고 있다.','기본소득|기본소득 찬반|보편적 기본소득'],\n'주 4일제와 노동시간':['장시간 노동 해소를 위해 주 4일제를 도입하자는 주장과 생산성·업종 현실을 고려해야 한다는 반론이 맞서고 있다.','주 4일제|주4.5일제|노동시간 단축'],\n'정규직·비정규직 격차':['고용 형태에 따라 임금과 복지가 크게 벌어지는 노동시장 이중구조가 불평등과 청년 고용 문제의 핵심으로 꼽힌다.','비정규직 정규직 전환|노동시장 이중구조|동일노동 동일임금'],\n'청년 실업과 니트족':['일할 의사를 잃고 쉬는 청년이 늘어나면서 일자리 미스매치와 청년 고용 정책의 실효성이 도마에 올랐다.','쉬었음 청년|니트족|청년 고용률'],\n'재벌 개혁과 대기업 집중':['재벌 총수 일가의 지배력 남용과 경제력 집중을 견제하기 위한 지배구조 개혁 요구가 꾸준히 제기되고 있다.','재벌 개혁|순환출자|상법 개정 이사 충실의무'],\n'중소기업과 하도급':['원청의 단가 후려치기와 기술 탈취 문제를 막기 위해 납품대금 연동제 등 하도급 거래 공정화가 추진되고 있다.','납품대금 연동제|하도급 갑질|기술 탈취'],\n'자영업 위기':['고금리와 내수 부진, 높은 배달 수수료가 겹치면서 자영업자의 폐업과 부채가 급증하고 있다.','자영업자 폐업|소상공인 대출|배달앱 수수료'],\n'저성장과 잠재성장률 하락':['인구 감소와 생산성 정체로 한국의 잠재성장률이 1%대로 떨어지며 장기 저성장 우려가 커지고 있다.','잠재성장률 하락|저성장 고착화|1%대 성장'],\n'조세 정의와 부자 감세':['상속세·법인세·종부세 완화가 경제 활력을 높이는지 부자 감세로 불평등을 키우는지를 두고 논쟁이 벌어지고 있다.','상속세 개편|부자 감세|종합부동산세 완화'],\n'가상자산과 투자 규제':['가상자산 시장이 커지면서 시세 조종과 거래소 파산으로부터 투자자를 보호할 규제 체계가 요구되고 있다.','가상자산 이용자보호법|코인 시세조종|가상자산 과세'],\n'금융 문맹과 청년 투자':['영끌과 빚투로 무리하게 투자에 나선 청년층이 손실을 보면서 금융 교육의 필요성이 커지고 있다.','청년 빚투|영끌|금융 교육 의무화'],\n'물가 상승과 생활비 위기':['식료품과 공공요금 등 생활 물가가 크게 오르면서 서민 가계의 실질소득이 줄어드는 생활비 위기가 이어지고 있다.','생활물가 상승|장바구니 물가|공공요금 인상'],\n'중대재해처벌법':['중대재해처벌법이 산업재해를 줄이는 데 효과가 있는지와 중소기업에 과도한 부담을 주는지를 두고 논쟁이 계속되고 있다.','중대재해처벌법|중대재해법 50인 미만 적용|산업재해 사망'],\n'이민과 외국인 노동자':['인력난이 심한 산업에서 외국인 노동자 의존이 커지면서 고용허가제 개선과 이민 확대가 함께 논의되고 있다.','외국인 노동자|고용허가제|외국인 가사관리사'],\n'공기업 효율화와 민영화':['공기업의 부채와 방만 경영을 줄이려는 효율화 정책이 민영화와 공공요금 인상으로 이어질 수 있다는 우려를 낳고 있다.','공기업 민영화|공공기관 부채|한전 적자'],\n'고령화와 노인 돌봄':['초고령사회 진입으로 돌봄이 필요한 노인이 급증하면서 요양 인력 부족과 가족 돌봄 부담이 커지고 있다.','노인 돌봄|요양보호사 부족|초고령사회'],\n'1인 가구 증가':['전체 가구의 3분의 1을 넘어선 1인 가구에 맞춰 주거·복지·안전 정책을 다시 설계해야 한다는 요구가 커지고 있다.','1인 가구 증가|1인 가구 정책|나혼자 가구'],\n'고독사와 사회적 고립':['중장년 남성을 중심으로 고독사가 늘고 은둔 청년이 증가하면서 사회적 고립이 공공의 문제로 떠오르고 있다.','고독사|은둔형 외톨이|사회적 고립'],\n'학교폭력':['학교폭력 가해 기록의 대입 반영이 확대되면서 처벌 강화의 억지 효과와 소송 남발 부작용이 함께 논란이 되고 있다.','학교폭력 생활기록부|학폭 대입 반영|학교폭력 소송'],\n'교권 침해':['서이초 교사 사망 사건 이후 학부모 악성 민원과 아동학대 신고 남용으로부터 교사를 보호해야 한다는 목소리가 커졌다.','교권 침해|서이초 사건|교권보호 5법'],\n'청소년 정신건강':['SNS 사용 증가와 입시 경쟁 속에서 우울과 자해를 겪는 청소년이 늘어나며 정신건강 지원 체계가 요구되고 있다.','청소년 우울증|청소년 자해|청소년 정신건강'],\n'자살률 문제':['한국이 OECD 자살률 1위를 이어가면서 정신건강 서비스 접근성과 자살 예방 정책의 실효성이 도마에 올랐다.','OECD 자살률 1위|자살 예방 정책|자살률'],\n'장애인 이동권':['전장연의 지하철 시위를 계기로 저상버스와 엘리베이터 등 장애인 이동권 보장의 속도와 방식이 쟁점이 됐다.','장애인 이동권|전장연 지하철 시위|저상버스'],\n'다문화 가정과 차별':['다문화 가정 자녀가 늘어나고 있지만 학교와 일상에서 겪는 차별과 언어 장벽은 여전히 해소되지 않고 있다.','다문화 가정 차별|다문화 학생|이주배경 아동'],\n'성평등과 유리천장':['한국은 OECD 최대 수준의 성별 임금 격차를 보이며 여성의 고위직 진출을 막는 유리천장이 여전하다는 평가를 받는다.','성별 임금 격차|유리천장 지수|여성 임원 비율'],\n'채용 공정성':['공공기관 채용 비리와 고용 세습 논란 이후 블라인드 채용 등 공정한 채용 제도에 대한 요구가 커지고 있다.','채용 비리|블라인드 채용|고용 세습'],\n'능력주의 논쟁':['인국공 정규직 전환 논란 등을 계기로 능력에 따른 보상이 공정한지 출발선의 불평등을 가리는지가 쟁점이 됐다.','능력주의|인국공 사태|공정 담론'],\n'동물권과 반려동물':['반려동물 양육 인구가 늘면서 동물을 물건이 아닌 생명으로 대우해야 한다는 동물권 논의가 확산되고 있다.','동물권|반려동물 양육|동물 학대'],\n'노키즈존':['아동의 출입을 막는 노키즈존이 영업의 자유인지 아동에 대한 차별인지를 두고 논쟁이 이어지고 있다.','노키즈존|노키즈존 차별|노키즈존 인권위'],\n'층간소음과 공동주택 갈등':['층간소음 갈등이 폭행과 살인 사건으로까지 번지면서 건설 단계의 소음 기준 강화가 요구되고 있다.','층간소음|층간소음 기준|층간소음 사후확인제'],\n'마약 확산':['10대와 20대까지 마약 사범이 급증하면서 처벌 강화와 치료·재활 중심 정책 사이의 균형이 논의되고 있다.','마약 사범 급증|청소년 마약|마약 치료 재활'],\n'의대 쏠림과 입시':['상위권 학생이 의대로 몰리는 현상이 심해지면서 이공계 인재 부족과 입시 과열이 함께 우려되고 있다.','의대 쏠림|의대 입시|이공계 기피'],\n'대학 구조조정':['학령인구 감소로 지방대의 신입생 미달과 폐교가 이어지면서 대학 구조조정의 방향이 쟁점이 되고 있다.','지방대 위기|대학 구조조정|신입생 미달'],\n'사형제 존폐':['한국은 장기간 사형을 집행하지 않은 실질적 사형폐지국이지만 흉악범죄가 발생할 때마다 사형제 존폐 논쟁이 되살아난다.','사형제 폐지|사형제 헌법소원|사형 집행'],\n'안락사와 조력존엄사':['연명의료결정법을 넘어 의사의 도움으로 생을 마감하는 조력존엄사를 허용할지를 두고 논쟁이 벌어지고 있다.','조력존엄사|안락사 법제화|연명의료결정법'],\n'낙태죄 헌법불합치 이후':['헌법재판소가 낙태죄에 헌법불합치 결정을 내린 뒤 국회가 대체 입법을 하지 않아 입법 공백이 이어지고 있다.','낙태죄 헌법불합치|낙태죄 입법 공백|임신중지'],\n'차별금지법':['성별·장애·성적 지향 등을 이유로 한 차별을 포괄적으로 금지하는 차별금지법 제정이 오랫동안 논쟁 중이다.','포괄적 차별금지법|차별금지법 제정|평등법'],\n'성범죄와 디지털 성범죄':['딥페이크 성착취물과 불법촬영 등 디지털 성범죄가 확산되면서 처벌 강화와 플랫폼 책임이 요구되고 있다.','딥페이크 성범죄|디지털 성범죄|불법촬영물'],\n'스토킹 처벌':['신당역 사건 이후 스토킹처벌법의 반의사불벌죄 조항이 폐지됐지만 피해자 보호의 실효성은 여전히 과제로 남아 있다.','스토킹처벌법|신당역 사건|스토킹 반의사불벌죄 폐지'],\n'음주운전 처벌':['윤창호법 일부 조항이 위헌 결정을 받은 뒤에도 음주운전 재범이 끊이지 않아 처벌 방식에 대한 논의가 이어지고 있다.','음주운전 처벌|윤창호법 위헌|음주운전 재범'],\n'사이버 명예훼손':['사실을 적시해도 처벌하는 사실적시 명예훼손죄가 표현의 자유를 지나치게 제약하는지를 두고 논쟁이 계속되고 있다.','사실적시 명예훼손|사이버 명예훼손|악성댓글 처벌'],\n'개인정보 보호':['대규모 개인정보 유출 사고가 반복되면서 기업의 책임 강화와 개인정보 보호 체계 개선이 요구되고 있다.','개인정보 유출|개인정보보호법 과징금|개인정보 유출 사고'],\n'검찰 개혁과 수사권 조정':['검경 수사권 조정과 검수완박 입법 이후 검찰 권한의 범위와 수사 공백 문제를 둘러싼 논쟁이 이어지고 있다.','검수완박|검경 수사권 조정|검찰청 폐지'],\n'전관예우':['퇴직 판검사가 변호사로 개업해 친정 사건을 수임하는 전관예우가 사법 신뢰를 해친다는 비판이 계속되고 있다.','전관예우|전관 변호사 수임 제한|법조 전관'],\n'국민참여재판':['국민참여재판이 시행된 지 오래됐지만 신청률과 배심 평결의 구속력이 낮아 제도의 실효성이 의문시되고 있다.','국민참여재판|배심원 평결|국민참여재판 배제'],\n'양심적 병역거부':['대체복무제가 도입됐지만 교정시설 36개월 복무가 사실상의 징벌이라는 비판과 형평성 논쟁이 이어지고 있다.','양심적 병역거부|대체복무제|양심적 병역거부 무죄'],\n'신상공개 제도':['흉악범 신상공개 확대가 국민의 알 권리를 충족하는지 무죄추정 원칙을 침해하는지를 두고 논쟁이 벌어지고 있다.','피의자 신상공개|머그샷 공개|중대범죄신상공개법'],\n'사적 제재와 디지털 교도소':['디지털 교도소와 사적 신상 공개처럼 법 대신 직접 처벌하려는 사적 제재가 무고한 피해를 낳고 있다.','디지털 교도소|사적 제재|신상 폭로'],\n'저작권과 AI':['인공지능이 저작물을 무단으로 학습하고 생성물을 만들어내면서 저작권 보호와 기술 발전 사이의 균형이 쟁점이 됐다.','AI 학습 데이터 저작권|AI 생성물 저작권|생성형 AI 저작권 소송'],\n'동물학대 처벌':['동물학대 사건에 대한 솜방망이 처벌 비판 속에 동물을 물건으로 보지 않는 민법 개정과 처벌 강화가 추진되고 있다.','동물학대 처벌|동물은 물건이 아니다 민법|동물보호법 개정'],\n'직장 내 괴롭힘':['직장 내 괴롭힘 금지법 시행 이후에도 5인 미만 사업장 제외와 신고 후 보복 문제로 실효성 논란이 계속되고 있다.','직장 내 괴롭힘 금지법|직장 내 괴롭힘 신고|5인 미만 사업장 괴롭힘'],\n'K-콘텐츠와 문화 산업':['K-콘텐츠가 세계적 인기를 얻고 있지만 수익이 글로벌 플랫폼에 집중되면서 국내 제작 생태계의 지속성이 우려되고 있다.','K-콘텐츠 수출|한류 콘텐츠 산업|K콘텐츠 IP'],\n'OTT와 방송 산업 변화':['넷플릭스 등 글로벌 OTT가 시장을 장악하면서 지상파와 토종 OTT의 경쟁력 약화가 문제가 되고 있다.','토종 OTT 위기|넷플릭스 국내 시장|지상파 위기'],\n'공영방송의 독립성':['정권이 바뀔 때마다 공영방송 사장과 이사진이 교체되면서 방송의 정치적 독립성 확보가 핵심 과제로 꼽힌다.','공영방송 지배구조|KBS 수신료 분리징수|방송3법'],\n'언론 자유와 언론중재법':['허위보도에 징벌적 손해배상을 도입하려던 언론중재법 개정안이 언론 자유를 위축시킨다는 반발에 부딪혔다.','언론중재법 개정안|언론 징벌적 손해배상|허위보도 피해구제'],\n'알고리즘과 필터버블':['추천 알고리즘이 이용자가 좋아하는 정보만 보여주면서 필터버블이 확증편향과 사회적 분열을 키운다는 우려가 커지고 있다.','필터버블|추천 알고리즘 편향|알고리즘 확증편향'],\n'숏폼 콘텐츠와 문해력':['짧은 영상에 익숙해진 세대의 집중력과 문해력이 떨어진다는 우려가 커지며 숏폼 콘텐츠의 영향이 논란이다.','숏폼 중독|문해력 저하|도파민 중독'],\n'게임 중독과 게임 산업':['WHO가 게임이용장애를 질병으로 분류하면서 국내 도입 여부를 둘러싸고 보건 당국과 게임 업계가 맞서고 있다.','게임이용장애 질병코드|게임 중독|게임 질병코드 도입'],\n'문화유산 보존과 개발':['문화유산 주변 개발을 제한하는 규제가 주민 재산권과 지역 개발을 가로막는다는 갈등이 반복되고 있다.','종묘 앞 고층 개발|문화유산 개발 규제|국가유산 보존'],\n'문화 다양성':['이주민과 소수 문화가 늘어나면서 다양한 문화를 존중하고 공존하는 사회를 만들기 위한 정책적 노력이 요구되고 있다.','문화다양성|문화다양성 정책|상호문화'],\n'팬덤 문화':['아이돌 팬덤의 막대한 소비력과 사회공헌 활동이 주목받는 한편 앨범 과소비와 사생 문제 등 부작용도 제기되고 있다.','아이돌 팬덤|앨범 밀어내기|팬덤 소비'],\n'외모지상주의':['외모를 능력과 가치의 기준으로 삼는 외모지상주의가 성형 열풍과 채용 차별로 이어진다는 비판을 받고 있다.','외모지상주의|외모 차별 채용|성형 공화국'],\n'혐오 표현과 밈 문화':['특정 집단을 조롱하는 밈과 신조어가 놀이처럼 소비되면서 온라인 혐오 표현이 일상화되고 있다.','혐오 밈|온라인 혐오 표현|혐오 신조어'],\n'출판·독서 문화 위기':['성인 독서율이 역대 최저를 기록하는 가운데 도서정가제와 출판 지원 정책의 방향을 둘러싼 논쟁이 이어지고 있다.','성인 독서율|도서정가제|출판 시장 위기'],\n'스포츠와 공정':['체육계 폭력과 성폭력 사건이 잇따르면서 성적 지상주의를 넘어선 스포츠 인권 보호 체계가 요구되고 있다.','체육계 폭력|스포츠 인권|선수 인권'],\n'지역 문화 격차':['공연장과 미술관 등 문화 인프라가 수도권에 몰려 있어 지역 주민의 문화 향유 기회가 크게 뒤처지고 있다.','지역 문화 격차|문화 인프라 수도권 집중|지역 문화 소멸'],\n'관광과 오버투어리즘':['관광객이 지나치게 몰리는 오버투어리즘이 주민 생활을 침해하면서 관광세와 입장 제한 같은 대책이 논의되고 있다.','오버투어리즘|북촌 관광 제한|관광세'],\n'종교와 사회':['종교인 과세와 종교 단체의 정치 개입 문제를 계기로 종교의 자유와 정교분리 원칙의 경계가 쟁점이 되고 있다.','종교인 과세|정교분리|종교 정치 개입'],\n'인플루언서와 뒷광고':['인플루언서가 광고 사실을 숨기고 제품을 홍보하는 뒷광고가 적발되면서 소비자 기만 규제가 강화되고 있다.','뒷광고|인플루언서 광고 표시|SNS 뒷광고 규제'],\n'저작권과 불법 복제':['웹툰과 영상을 무단으로 퍼뜨리는 불법 복제 사이트가 창작자의 수익을 빼앗으면서 단속 강화가 요구되고 있다.','웹툰 불법 복제|누누티비|불법 유통 사이트'],\n'자율주행차와 책임':['자율주행차 사고가 났을 때 운전자와 제조사 중 누가 책임져야 하는지에 대한 법적 기준 마련이 시급하다.','자율주행차 사고 책임|자율주행 레벨3|자율주행 제조물 책임'],\n'AI 윤리와 규제':['AI 기본법 제정과 EU AI법 시행으로 인공지능의 위험을 규제하면서 혁신을 저해하지 않는 방안이 쟁점이 되고 있다.','AI 기본법|EU AI법|고영향 AI 규제'],\n'딥페이크 기술':['누구나 쉽게 딥페이크를 만들 수 있게 되면서 선거 조작과 성착취, 사기에 악용되는 피해가 급증하고 있다.','딥페이크|딥페이크 선거|딥페이크 피싱'],\n'유전자 편집':['크리스퍼 유전자가위 기술이 난치병 치료의 길을 열었지만 인간 배아 편집은 생명윤리 논쟁을 불러일으키고 있다.','크리스퍼 유전자가위|유전자 편집 아기|배아 유전자 편집'],\n'원격의료':['코로나19 때 한시적으로 허용된 비대면 진료를 제도화하는 과정에서 의료계와 플랫폼 업계가 맞서고 있다.','비대면 진료 제도화|원격의료|비대면 진료 플랫폼'],\n'감염병 대응과 공중보건':['코로나19 방역 과정에서 공중보건을 위한 이동 제한과 개인정보 수집이 개인의 자유를 어디까지 제한할 수 있는지 논란이 됐다.','감염병 방역 기본권|코로나 방역 패스|공공의료 확충'],\n'우주 개발':['누리호 발사 성공과 우주항공청 출범으로 한국의 우주 개발이 본격화됐지만 민간 산업 육성과 예산 확보가 과제로 남아 있다.','우주항공청|누리호 발사|뉴스페이스'],\n'반도체 산업 경쟁':['미국·대만·중국이 반도체 패권 경쟁을 벌이는 가운데 한국 반도체 산업의 보조금과 인력 지원이 쟁점이 되고 있다.','반도체 보조금|반도체특별법|반도체 패권 경쟁'],\n'데이터 3법과 빅데이터':['데이터 3법 개정으로 가명정보 활용이 허용되면서 데이터 산업 육성과 개인정보 침해 우려가 충돌하고 있다.','데이터 3법|가명정보 활용|마이데이터'],\n'사이버 보안':['랜섬웨어와 국가 배후 해킹 공격이 늘어나면서 기업과 공공기관의 사이버 보안 체계 강화가 시급해졌다.','랜섬웨어 공격|해킹 피해|사이버 보안 기본법'],\n'로봇과 일자리 자동화':['공장과 서비스업에서 로봇 도입이 빨라지면서 일자리 감소에 대비해 로봇세를 도입하자는 주장이 제기되고 있다.','로봇세|일자리 자동화|로봇 밀도'],\n'플랫폼 독점':['거대 플랫폼이 시장 지배력을 이용해 자사 우대와 수수료 인상을 하면서 플랫폼 독점 규제 입법이 추진되고 있다.','플랫폼법|플랫폼 독과점|카카오 독점'],\n'기초과학 투자와 R&D':['국가 R&D 예산이 대폭 삭감되면서 기초과학 연구 현장의 위축과 연구 생태계 붕괴 우려가 커졌다.','R&D 예산 삭감|기초과학 연구비|연구 생태계'],\n'이공계 인재 유출':['이공계 우수 인재가 의대로 빠져나가거나 해외로 떠나면서 과학기술 경쟁력 약화가 우려되고 있다.','이공계 인재 유출|두뇌 유출|과학기술 인재 해외 유출'],\n'메타버스와 가상세계':['메타버스 열풍이 꺼진 뒤에도 가상세계에서의 성범죄와 재산권 같은 새로운 법적 문제는 여전히 남아 있다.','메타버스 성범죄|메타버스 규제|가상세계 아바타'],\n'디지털 중독':['청소년의 스마트폰과 SNS 과의존이 심해지면서 학교 내 스마트폰 사용 제한과 SNS 연령 규제가 논의되고 있다.','스마트폰 과의존|청소년 SNS 금지|학교 휴대폰 금지'],\n'의약품 접근성과 신약 가격':['한 번 투약에 수억 원이 드는 초고가 신약이 늘어나면서 건강보험 재정과 환자의 치료 접근권이 충돌하고 있다.','초고가 신약|신약 건강보험 급여|약가 협상'],\n'원자력 발전':['탄소중립과 에너지 안보를 위해 원전을 늘려야 한다는 주장과 사고 위험과 핵폐기물 문제를 우려하는 목소리가 맞서고 있다.','원전 확대|탈원전|신규 원전 건설'],\n'재생에너지 전환':['RE100 요구가 커지는 가운데 한국은 재생에너지 비중이 낮아 태양광과 풍력 확대의 속도와 방식이 쟁점이 되고 있다.','재생에너지 비중|RE100|해상풍력'],\n'플라스틱 쓰레기':['일회용 플라스틱 사용이 늘어나는 가운데 일회용컵 보증금제 후퇴 등으로 정부의 규제 의지가 의심받고 있다.','일회용품 규제|일회용컵 보증금제|플라스틱 협약'],\n'미세먼지':['중국발 미세먼지와 국내 배출원이 복합적으로 작용하면서 미세먼지 저감 대책의 실효성이 논란이 되고 있다.','미세먼지 저감|중국발 미세먼지|미세먼지 계절관리제'],\n'후쿠시마 오염수 방류':['일본이 후쿠시마 원전 오염수의 해양 방류를 시작하면서 과학적 안전성과 국제적 책임을 둘러싼 논쟁이 이어지고 있다.','후쿠시마 오염수 방류|오염수 해양 방류|오염수 방사능'],\n'탄소세와 배출권 거래제':['탄소 배출에 가격을 매기는 탄소세와 배출권 거래제가 감축 효과와 산업 부담 사이에서 논쟁이 되고 있다.','탄소세 도입|배출권 거래제|EU 탄소국경조정제도'],\n'기후 소송과 미래세대':['헌법재판소가 탄소중립기본법의 감축 목표에 헌법불합치 결정을 내리면서 미래세대의 기본권이 주목받고 있다.','기후소송 헌법불합치|아기기후소송|탄소중립기본법 헌법불합치'],\n'이상기후와 재난 대응':['폭염과 폭우, 대형 산불이 잦아지면서 기후 재난에 대비한 국가 재난 대응 체계의 한계가 드러나고 있다.','기후 재난|극한호우|대형 산불'],\n'물 부족과 수자원':['가뭄이 잦아지고 물 수요가 늘어나면서 댐 건설과 수자원 관리 방식을 둘러싼 갈등이 생기고 있다.','가뭄 물 부족|신규 댐 건설|수자원 관리'],\n'생물다양성 감소':['서식지 파괴와 기후변화로 멸종위기종이 늘어나면서 생물다양성 보전이 국제적 과제로 떠오르고 있다.','생물다양성 감소|멸종위기종|쿤밍-몬트리올 생물다양성'],\n'전기차 전환':['내연기관차 퇴출 일정이 다가오는 가운데 전기차 화재 우려와 충전 인프라 부족으로 전기차 전환이 정체되고 있다.','전기차 캐즘|전기차 화재|내연기관차 판매 금지'],\n'그린워싱':['친환경이 아닌데도 친환경인 것처럼 홍보하는 그린워싱이 늘면서 ESG 경영의 신뢰성이 흔들리고 있다.','그린워싱|그린워싱 규제|ESG 공시'],\n'음식물 쓰레기와 식량 낭비':['생산된 식량의 상당량이 버려지는 반면 기아 인구는 줄지 않으면서 음식물 쓰레기 감축이 기후 문제와 함께 다뤄지고 있다.','음식물 쓰레기 감축|식량 낭비|푸드뱅크'],\n'기후 난민':['해수면 상승과 가뭄으로 삶의 터전을 잃는 기후 난민이 늘어나지만 국제법상 난민으로 보호받지 못하고 있다.','기후 난민|기후 이주|해수면 상승 이주'],\n'개발과 환경 보존':['신공항과 케이블카 같은 대형 개발 사업이 환경영향평가를 거치면서 지역 개발과 생태 보존이 충돌하고 있다.','가덕도 신공항 환경|설악산 케이블카|환경영향평가'],\n'비건과 육식 문화':['축산업의 온실가스 배출과 동물 복지 문제로 비건과 대체육이 주목받으면서 식문화 선택을 둘러싼 논쟁이 생기고 있다.','비건 채식|대체육|축산업 온실가스'],\n'에너지 요금 현실화':['한전의 막대한 적자 속에 전기·가스 요금을 원가에 맞게 올리는 요금 현실화와 서민 부담 완화가 충돌하고 있다.','전기요금 인상|한전 적자|에너지 바우처'],\n'핵폐기물 처분장':['원전 내 사용후핵연료 저장시설이 포화에 가까워지면서 고준위 방사성폐기물 처분장 부지 선정이 시급해졌다.','고준위 방폐물 특별법|사용후핵연료 포화|방폐장 부지'],\n'도시 녹지와 열섬':['폭염이 심해지면서 도심이 주변보다 뜨거운 열섬 현상을 줄이기 위한 도시 녹지 확충이 요구되고 있다.','도시 열섬 현상|도시 숲|폭염 쉼터'],\n'미중 패권 경쟁':['미국과 중국의 기술·무역 패권 경쟁이 격화되면서 한국은 안보와 경제 사이에서 외교적 선택을 강요받고 있다.','미중 패권 경쟁|미중 반도체 갈등|안미경중'],\n'한일 관계':['과거사 문제와 안보 협력 필요성이 엇갈리면서 한일 관계 개선의 방향과 속도를 둘러싼 논쟁이 이어지고 있다.','한일 관계 개선|한일 정상회담|한미일 안보 협력'],\n'강제징용 배상 문제':['대법원의 강제징용 배상 판결 이후 정부가 제3자 변제안을 내놓으면서 피해자 동의와 일본의 책임 문제가 쟁점이 됐다.','강제징용 제3자 변제|강제징용 배상 판결|일제 강제동원 피해자'],\n'북핵 문제':['북한이 핵무력을 헌법에 명시하고 고도화하면서 비핵화 협상의 실효성과 한국의 자체 핵무장론이 논란이 되고 있다.','북핵 고도화|자체 핵무장론|비핵화 협상'],\n'러시아-우크라이나 전쟁':['러시아의 우크라이나 침공이 장기화되면서 국제 질서의 변화와 한국의 무기 지원 여부가 쟁점이 되고 있다.','우크라이나 전쟁|우크라이나 무기 지원|북한군 러시아 파병'],\n'중동 분쟁':['이스라엘과 하마스의 전쟁으로 가자지구에서 대규모 민간인 희생이 발생하면서 자위권과 국제인도법의 경계가 쟁점이 됐다.','가자지구 전쟁|이스라엘 하마스|가자 인도주의 위기'],\n'보호무역과 공급망':['미국의 고율 관세와 자국 우선주의로 보호무역이 확산되면서 수출 의존도가 높은 한국 경제의 대응이 과제가 되고 있다.','트럼프 관세|보호무역주의|공급망 재편'],\n'공적개발원조(ODA)':['한국은 원조를 받던 나라에서 주는 나라가 됐지만 ODA 규모와 국익 중심의 원조 방식을 둘러싼 논쟁이 이어지고 있다.','공적개발원조 ODA|ODA 예산|한국 ODA'],\n'국제기구의 역할과 한계':['상임이사국의 거부권 행사로 유엔 안보리가 분쟁 해결에 무력해지면서 국제기구의 실효성이 의문시되고 있다.','유엔 안보리 거부권|국제기구 무력화|WHO 탈퇴'],\n'이민 정책과 인구 위기':['인구 감소에 대응하기 위해 이민청을 설립하고 이민을 본격 확대해야 한다는 주장과 사회 통합 우려가 맞서고 있다.','이민청 설립|이민 확대|이민 정책'],\n'글로벌 식량 위기':['기후변화와 전쟁으로 곡물 가격이 요동치면서 곡물 자급률이 낮은 한국의 식량 안보가 위협받고 있다.','식량 안보|곡물 자급률|글로벌 식량 위기'],\n'기후 협약과 국제 협력':['파리협정의 목표 달성이 멀어지는 가운데 선진국과 개도국이 기후 재원과 감축 책임을 두고 대립하고 있다.','파리협정|COP 기후총회|기후 재원'],\n'인권 외교':['북한 인권과 탈북민 강제북송 문제에 대해 인권 원칙과 외교적 실리 중 무엇을 우선할지가 논쟁이 되고 있다.','북한 인권|탈북민 강제북송|북한인권법'],\n'방위산업과 무기 수출':['K-방산 수출이 급증하면서 경제적 성과와 분쟁 지역 무기 수출에 대한 윤리적 문제가 함께 제기되고 있다.','K-방산 수출|방산 수출 폴란드|무기 수출 윤리'],\n'디지털 무역과 빅테크 과세':['글로벌 빅테크가 국내에서 큰 수익을 올리면서도 세금을 적게 낸다는 비판 속에 디지털세 도입이 논의되고 있다.','디지털세|구글 세금 회피|빅테크 과세'],\n'재외동포와 국적':['인구 감소 대응과 인재 유치를 위해 복수국적 허용 연령을 낮추자는 논의가 병역 형평성 문제와 충돌하고 있다.','복수국적 허용 확대|재외동포청|국적법 개정'],\n'국제 난민 위기':['전쟁과 박해를 피해 고향을 떠난 난민이 역대 최대를 기록하면서 국제사회의 난민 보호 책임이 다시 쟁점이 되고 있다.','난민 1억명|난민 보호 국제|유럽 난민 위기'],\n'동북아 역사 갈등':['중국의 동북공정과 일본의 독도 영유권 주장 등 동북아 역사 갈등이 외교 관계를 계속 흔들고 있다.','동북공정|독도 영유권|역사 왜곡 교과서'],\n'개발도상국 부채 위기':['고금리와 달러 강세로 개발도상국의 부채 부담이 커지면서 국제 금융 질서의 공정성이 도마에 올랐다.','개도국 부채 위기|IMF 구제금융|채무 탕감']\n};\n\n})();\n<\u002Fscript><\u002Fhelmet>\n<div style=\"min-height:100vh;background:#f3f1e8\">\n\n<header style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px clamp(20px,5vw,64px);flex-wrap:wrap\">\n  <div style=\"display:flex;align-items:center;gap:12px\">\n    <div style=\"position:relative;width:38px;height:38px;flex-shrink:0\"><div style=\"position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:#7F4C4C\"><\u002Fdiv><div style=\"position:absolute;left:0;top:0;width:26px;height:26px;overflow:hidden\"><div style=\"position:absolute;left:14px;top:14px;width:24px;height:24px;border-radius:50%;background:#5d6b3a\"><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;left:0;top:0;width:26px;height:26px;box-sizing:border-box;border:1.5px solid #151515\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;line-height:1.05;letter-spacing:-0.01em\">Thought<br>Library<\u002Fdiv>\n  <\u002Fdiv>\n  <nav style=\"display:flex;gap:28px;flex-wrap:wrap;font-size:12px;letter-spacing:0.18em;text-transform:uppercase\">\n    <span sc-camel-on-click=\"{{ goLib }}\" style=\"cursor:pointer\" style-hover=\"opacity:0.5\">Library<\u002Fspan>\n    <span sc-camel-on-click=\"{{ goQ }}\" style=\"cursor:pointer\" style-hover=\"opacity:0.5\">Questions<\u002Fspan>\n    <span sc-camel-on-click=\"{{ goP }}\" style=\"cursor:pointer\" style-hover=\"opacity:0.5\">Passage<\u002Fspan>\n    <span sc-camel-on-click=\"{{ goT }}\" style=\"cursor:pointer\" style-hover=\"opacity:0.5\">Timer<\u002Fspan>\n    <span sc-camel-on-click=\"{{ goM }}\" style=\"cursor:pointer\" style-hover=\"opacity:0.5\">My Page<\u002Fspan>\n  <\u002Fnav>\n<\u002Fheader>\n\n<section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));min-height:520px\">\n  <div style=\"padding:clamp(40px,8vw,110px) clamp(20px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;width:max-content\"><div style=\"display:flex;gap:7px;align-items:flex-end\"><div style=\"width:14.5px;height:14.5px;box-sizing:border-box;border:1px solid #6b6966\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:8px 8px 0 0;background:{{ accent }}\"><\u002Fdiv><div style=\"width:16px;height:16px;margin-left:-1px;border-radius:50%;background:#7F4C4C\"><\u002Fdiv><\u002Fdiv><div style=\"height:1px;background:#c9c6bf\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.2em;color:{{ accent2 }}\">Archiving Page<\u002Fdiv>\n    <h1 data-reveal=\"1\" style=\"margin:0;font-family:'Noto Serif KR',serif;font-weight:500;font-size:clamp(34px,4.6vw,58px);line-height:1.22;letter-spacing:-0.03em;text-wrap:pretty\">당신의 생각은<br>무엇인가요?<\u002Fh1>\n    <p style=\"margin:0;max-width:420px;font-size:15px;line-height:1.75;color:#4a4845;text-wrap:pretty\">주제별 지식 카드를 통해 쟁점과 관점을 읽고, <br>예상 질문과 제시문을 확인해, 타이머로 답변을 연습할 수 있습니다.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ heroRandom }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:14px;padding:14px 22px;background:#151515;color:#f3f1e8;border:1px solid #151515;cursor:pointer\" style-hover=\"background:#333\">오늘의 질문으로 연습<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ heroContinue }}\" style=\"font:inherit;white-space:nowrap;flex-shrink:0;font-size:14px;padding:14px 22px;background:transparent;color:#151515;border:1px solid #151515;cursor:pointer\" style-hover=\"background:#e8e6e1\">{{ heroContinueLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ heroHasToday }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;max-width:440px;border-top:1px solid #d8d5c6;padding-top:16px\">\n        <span style=\"font-size:11px;letter-spacing:0.2em;color:#6b6966\">오늘의 질문 · {{ heroTodayCat }}<\u002Fspan>\n        <span style=\"font-family:'Noto Serif KR',serif;font-size:15.5px;line-height:1.65;word-break:keep-all\">{{ heroTodayQ }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:none\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#373533;color:#f3f1e8;padding:clamp(32px,6vw,72px) clamp(24px,5vw,64px);display:flex;gap:40px;position:relative;overflow:hidden\"><canvas ref=\"{{ orbRef }}\" style=\"position: absolute; inset: 0; width: 488px; height: 473px; pointer-events: none; left: 2px; top: 33px\"><\u002Fcanvas>\n    <div style=\"position:relative;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:0.3em;color:#9a9893\">INDEX<\u002Fdiv><div data-index-list=\"1\" style=\"position:relative;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(14px,2.4vw,28px);align-content:end;padding-top:clamp(220px,28vw,320px)\">\n      <sc-for list=\"{{ indexList }}\" as=\"ix\" hint-placeholder-count=\"10\">\n        <div sc-camel-on-click=\"{{ ix.go }}\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #4b4845;cursor:pointer\" style-hover=\"padding-left:6px\">\n          <span style=\"display:flex;align-items:center;gap:12px;font-family:'Noto Serif KR',serif;font-size:clamp(15px,1.6vw,20px);font-weight:300;white-space:nowrap\"><span style=\"width:9px;height:11px;flex-shrink:0;border-radius:4.5px 4.5px 0 0;background:rgba(225,223,218,0.55)\"><\u002Fspan>{{ ix.label }}<\u002Fspan>\n          \n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<section ref=\"{{ libRef }}\" style=\"display:grid;grid-template-columns:clamp(56px,9vw,120px) minmax(0,1fr);padding:clamp(44px,6vw,80px) clamp(16px,4vw,56px) clamp(44px,6vw,80px) 0\">\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px\">\n    <div style=\"font-family:'Noto Serif KR',serif;font-size:clamp(32px,4vw,52px);color:#c9c6bf;font-weight:300\">01<\u002Fdiv>\n    <div style=\"width:1px;height:64px;background:#151515\"><\u002Fdiv><div style=\"width:9px;height:9px;border-radius:50%;border:1px solid #151515\"><\u002Fdiv>\n    <div style=\"writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:0.3em\">LIBRARY<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:32px;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h2 data-reveal=\"1\" style=\"margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(26px,3vw,36px);letter-spacing:-0.02em;word-break:keep-all\">지식 서재.<\u002Fh2>\n        <div style=\"width:40px;height:2px;background:{{ accent2 }}\"><\u002Fdiv>\n      <\u0
